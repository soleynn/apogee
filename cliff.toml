# git-cliff configuration: https://git-cliff.org
# CHANGELOG.md is generated from the commit history, so it is not edited by hand; the changelog
# workflow (.github/workflows/changelog.yml) regenerates it on each merge to main.

[changelog]
header = """
# Changelog

All notable changes to this project are documented here. Entries are grouped by crate, and each line
is tagged with its change type. Versioning aims to follow
[Semantic Versioning](https://semver.org/spec/v2.0.0.html).

"""
# Crate-first: one section per commit scope (the crate), change type as an italic tag per line.
# Unscoped commits (workspace-wide CI, docs, chores) collect under a trailing "workspace" section.
body = """
{% if version %}\
## [{{ version | trim_start_matches(pat="v") }}] - {{ timestamp | date(format="%Y-%m-%d") }}
{% else %}\
## [Unreleased]
{% endif %}\
{% for scope, scoped in commits | filter(attribute="scope") | group_by(attribute="scope") %}
### {{ scope }}
{% for commit in scoped %}\
- {{ commit.message | split(pat="\n") | first | trim | upper_first }} _({{ commit.group | lower }})_
{% endfor %}\
{% endfor %}\
{% if commits | filter(attribute="scope") | length < commits | length %}
### workspace
{% for commit in commits %}{% if not commit.scope %}\
- {{ commit.message | split(pat="\n") | first | trim | upper_first }} _({{ commit.group | lower }})_
{% endif %}{% endfor %}\
{% endif %}
"""
trim = true
footer = ""

[git]
conventional_commits = true
filter_unconventional = false
split_commits = false
# Normalize short crate scopes to their full crate names so each crate is one section.
commit_preprocessors = [
  { pattern = '^(\w+)\(addons\)', replace = '${1}(apogee-addons)' },
  { pattern = '^(\w+)\(fetch\)', replace = '${1}(apogee-fetch)' },
  { pattern = '^(\w+)\(otp\)', replace = '${1}(apogee-otp)' },
  { pattern = '^(\w+)\(patcher\)', replace = '${1}(apogee-patcher)' },
  { pattern = '^(\w+)\(runtime\)', replace = '${1}(apogee-runtime)' },
  { pattern = '^(\w+)\(secrets\)', replace = '${1}(apogee-secrets)' },
  { pattern = '^(\w+)\(sqpack\)', replace = '${1}(apogee-sqpack)' },
  { pattern = '^(\w+)\(zipatch\)', replace = '${1}(apogee-zipatch)' },
  { pattern = '^(\w+)\(test-support\)', replace = '${1}(apogee-test-support)' },
  # One-time backfill: the v0.4.0 cycle's squash-merge titles briefly dropped `type(scope):` (fixed by
  # the pr-title.yml check), so these commits parsed with no scope and several with the wrong group.
  # Keyed by PR number since the subjects are otherwise plain text; rewrites the raw subject line to
  # what a compliant title would have been so history need not be rewritten.
  { pattern = '^feat: prefix lifecycle, health check, and in-process path translation \(#64\)', replace = 'feat(apogee-runtime): prefix lifecycle, health check, and in-process path translation (#64)' },
  { pattern = '^feat: environment matrix and DXVK install \(#65\)', replace = 'feat(apogee-runtime): environment matrix and DXVK install (#65)' },
  { pattern = '^fix: Proton prefix init and broad stop under umu 1\.4\.1 \(#66\)', replace = 'fix(apogee-runtime): Proton prefix init and broad stop under umu 1.4.1 (#66)' },
  { pattern = '^feat: frame-consistency metrics and a bench analyze command \(#67\)', replace = 'feat(apogee-runtime): frame-consistency metrics and a bench analyze command (#67)' },
  { pattern = '^feat: spawn and stop companion programs alongside the game \(#68\)', replace = 'feat(apogee-runtime): spawn and stop companion programs alongside the game (#68)' },
  { pattern = '^feat: choose config backup contents by rules that cannot silently match nothing \(#69\)', replace = 'feat(apogee-addons): choose config backup contents by rules that cannot silently match nothing (#69)' },
  { pattern = '^feat: config backup archive, restore, and retention \(#70\)', replace = 'feat(apogee-addons): config backup archive, restore, and retention (#70)' },
  { pattern = "^feat: run the user's own tools alongside the game \\(#71\\)", replace = "feat(apogee-addons): run the user's own tools alongside the game (#71)" },
  { pattern = '^feat: drive companion tools from the launch flow and the command line \(#73\)', replace = 'feat(apogee-core): drive companion tools from the launch flow and the command line (#73)' },
  { pattern = "^feat: back up, restore, and prune the game's settings from the launcher \\(#74\\)", replace = "feat(apogee-core): back up, restore, and prune the game's settings from the launcher (#74)" },
  { pattern = '^feat: keep the launcher store private, and capture settings before a patch \(#75\)', replace = 'feat(apogee-core): keep the launcher store private, and capture settings before a patch (#75)' },
  { pattern = '^feat: prefix verbs, a signed component manifest, and the withdrawal of the catalog \(#76\)', replace = 'feat(apogee-addons): prefix verbs, a signed component manifest, and the withdrawal of the catalog (#76)' },
  { pattern = '^feat: Dalamud as a launch setting, and the catalog of installable programs removed \(#77\)', replace = 'feat(apogee-addons): Dalamud as a launch setting, and the catalog of installable programs removed (#77)' },
  { pattern = '^Read SqPack indexes and resolve a game path to its bytes \(#79\)', replace = 'feat(apogee-sqpack): read SqPack indexes and resolve a game path to its bytes (#79)' },
  { pattern = '^Extract a file from a SqPack dat entry \(#80\)', replace = 'feat(apogee-sqpack): extract a file from a SqPack dat entry (#80)' },
  { pattern = '^fix: bring boot current before registering, and read a 204 boot check as current \(#83\)', replace = 'fix(apogee-core): bring boot current before registering, and read a 204 boot check as current (#83)' },
  { pattern = '^Probe a derived current boot version in the live boot check \(#84\)', replace = 'feat(tools): probe a derived current boot version in the live boot check (#84)' },
  { pattern = "^Sweep an install's SqPack containers and report what disagrees with what they declare \\(#86\\)", replace = "feat(apogee-sqpack): sweep an install's SqPack containers and report what disagrees with what they declare (#86)" },
  { pattern = "^Say which of an install's files are not the ones Square Enix shipped \\(#87\\)", replace = "feat(apogee-sqpack): say which of an install's files are not the ones Square Enix shipped (#87)" },
  { pattern = '^Runner sync capability, Steam Deck detection, and a Steam registration \(#88\)', replace = 'feat(apogee-runtime): runner sync capability, Steam Deck detection, and a Steam registration (#88)' },
  { pattern = '^Resolve the launch environment, install DXVK, and make prefix trouble answerable \(#89\)', replace = 'feat(apogee-runtime): resolve the launch environment, install DXVK, and make prefix trouble answerable (#89)' },
  { pattern = '^Stop claiming one runner is the supported one \(#90\)', replace = 'fix(apogee-addons): stop claiming one runner is the supported one (#90)' },
  { pattern = '^Ship the license inside the release tarball \(#91\)', replace = 'fix: ship the license inside the release tarball (#91)' },
  { pattern = '^ci: fix changelog and release-notes generation for stable releases', replace = 'fix(ci): fix changelog and release-notes generation for stable releases' },
]
commit_parsers = [
  { message = "^feat", group = "Added" },
  { message = "^fix", group = "Fixed" },
  { message = "^perf", group = "Performance" },
  { message = "^refactor", group = "Changed" },
  { message = "^doc", group = "Documentation" },
  { message = "^test", group = "Testing" },
  { message = "^ci", group = "CI" },
  { message = "^build", group = "Build" },
  { message = "^style", group = "Styling" },
  { message = "^revert", group = "Reverted" },
  { message = "^chore\\(release\\)", skip = true },
  { message = "^chore\\(deps\\)", skip = true },
  # The changelog workflow's own auto-commit: exclude it so regeneration is idempotent (no perpetual
  # one-behind diff) and the changelog carries no "regenerate changelog" noise.
  { message = "^chore: regenerate changelog", skip = true },
  { message = "^chore", group = "Miscellaneous" },
  { body = ".*[Ss]ecurity", group = "Security" },
  # Catch-all so a non-conventional subject (e.g. a squash-merged PR title) still gets a group and the
  # template's `group | lower` never renders against null. Keeps such commits in the changelog rather
  # than crashing the whole regeneration.
  { message = ".*", group = "Changed" },
]
protect_breaking_commits = false
filter_commits = false
tag_pattern = "v[0-9]*"
# Checkpoint pre-release tags (v*-pre.N) never cut their own changelog section; their commits roll
# forward into the next stable release.
ignore_tags = "-pre"
topo_order = false
sort_commits = "oldest"
