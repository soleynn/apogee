[package]
name = "sqex-proto"
version = "0.0.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[dependencies]
# The obfuscated ticket type only, for the Steam login variant. Carrying the type rather than a
# string and a number keeps the pair inseparable: the size reported beside the ticket is not the
# text's length, and a caller that computed it here would get it wrong.
sqex-crypto = { path = "../sqex-crypto" }
http.workspace = true
url.workspace = true
percent-encoding.workspace = true
serde.workspace = true
serde_json.workspace = true
sha1.workspace = true
zeroize.workspace = true
async-trait.workspace = true
thiserror.workspace = true
tracing.workspace = true

[dev-dependencies]
apogee-test-support = { path = "../apogee-test-support" }
insta.workspace = true
rstest.workspace = true
proptest.workspace = true

[lints]
workspace = true
