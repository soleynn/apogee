[package]
name = "sqex-proto"
version = "0.0.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[dependencies]
# The obfuscated ticket type only, for the Steam login variant. Carrying the type rather than a
# string and a number keeps the pair inseparable: the size reported beside the ticket is not the
# text's length, and a caller that computed it here would get it wrong.
sqex-crypto = { path = "../sqex-crypto" }
http.workspace = true
url.workspace = true
percent-encoding.workspace = true
serde.workspace = true
serde_json.workspace = true
sha1.workspace = true
zeroize.workspace = true
async-trait.workspace = true
thiserror.workspace = true
tracing.workspace = true

[dev-dependencies]
apogee-test-support = { path = "../apogee-test-support" }
insta.workspace = true
rstest.workspace = true
proptest.workspace = true

[features]
# The dormant `gen_token` patch-URL tokenization request. SE disables the code path it exercises on
# the live service, so this is reachable only by an explicit, opt-in caller and stays off by default.
gen-token = []

[[test]]
name = "gen_token"
required-features = ["gen-token"]

[lints]
workspace = true

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]
