[package]
name = "apogee-core"
version = "0.0.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[dependencies]
thiserror.workspace = true
serde.workspace = true
serde_json.workspace = true
uuid.workspace = true
tracing.workspace = true
tokio.workspace = true
tokio-stream.workspace = true
tokio-util.workspace = true
reqwest.workspace = true
url.workspace = true
async-trait.workspace = true
sqex-proto = { path = "../sqex-proto" }
sqex-crypto = { path = "../sqex-crypto" }
apogee-fetch = { path = "../apogee-fetch" }
apogee-patcher = { path = "../apogee-patcher" }
apogee-runtime = { path = "../apogee-runtime" }
apogee-addons = { path = "../apogee-addons" }
apogee-secrets = { path = "../apogee-secrets" }
apogee-otp = { path = "../apogee-otp" }

# The monotonic clock the game re-derives its launch key from. Linux-only, so the windows-gnu
# cross-build never pulls rustix's `time` backend, which is unimplemented there.
[target.'cfg(target_os = "linux")'.dependencies]
rustix = { workspace = true, features = ["time"] }

[dev-dependencies]
apogee-test-support = { path = "../apogee-test-support" }
# The in-memory secret store, so no test reaches the machine's real keyring. `mock`, never
# `testing`: that feature gates tests that drive whatever provider is on the session bus, and
# depending on it here would unify it on for every workspace run and start raising unlock prompts.
apogee-secrets = { path = "../apogee-secrets", features = ["mock"] }
# test-util adds paused virtual time, so the flow's wait for the next one-time-password window costs
# the suite nothing to drive.
tokio = { workspace = true, features = ["test-util"] }
insta.workspace = true
rstest.workspace = true
proptest.workspace = true
tempfile.workspace = true
# Digests the embedded trust anchors, so a swapped root file fails a test rather than quietly
# becoming an authority this launcher obeys.
sha2.workspace = true

[lints]
workspace = true
