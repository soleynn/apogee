[package]
name = "apogee-sqpack"
version = "0.0.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[dependencies]
thiserror.workspace = true
# The block codec's DEFLATE payloads (raw, no zlib wrapper); one implementation shared with the
# patcher via this crate's `codec` module.
flate2.workspace = true
# The index path hash is CRC-32 with the final bit-inversion left off.
crc32fast.workspace = true
# All four hash fields a container carries (two header self hashes, one per index segment, one over a
# dat's data region) are SHA-1, so the integrity checks cannot be built without it.
sha1.workspace = true
# The whole-install sweep runs its archives, and each archive's data files, in parallel.
rayon.workspace = true

[features]
# Exposes src/fixtures.rs (synthetic archive builders) so another crate's tests can lay down real
# container bytes instead of hand-rolling them. Test-only; never a default feature (release builds
# never compile it).
test-fixtures = []

[dev-dependencies]
# Temp game trees for install-enumeration and lookup tests.
tempfile.workspace = true
# Recorded-fact header, index and path-hash fixtures (parsed field values + digests, no SE bytes)
# captured from a real install; serde_json reads them, sha2 re-hashes the live bytes in the
# install-gated tests and digests the generated path corpus.
serde_json.workspace = true
sha2.workspace = true
# The lookup-agrees-with-a-linear-scan property over synthetic index containers.
proptest.workspace = true

[lints]
workspace = true
