[package]
name = "apogee-secrets"
version = "0.0.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[dependencies]
thiserror.workspace = true
uuid.workspace = true
zeroize.workspace = true
# The credential-store API. Carries no store of its own, so it is the same on every target and the
# backend is whichever store crate the target block below names.
keyring-core.workspace = true
# The fallback store's seal. Nothing else in this crate does cryptography of its own: the platform
# stores encrypt their own items, and this is the backend for the sessions that have none.
argon2.workspace = true
chacha20poly1305.workspace = true
getrandom.workspace = true
# Only to read the plaintext password file another launcher writes when it is configured to keep one.
# Nothing this crate owns is serialized: a secret that could be written into config is the leak the
# crate exists to prevent.
serde_json.workspace = true

# The open flags the fallback store's directory and lock handling needs and the standard library does
# not expose: `O_NOFOLLOW` and `O_NONBLOCK`, so a path is opened and what it may resolve to is refused
# in the same syscall rather than in a check the open cannot be held to. A safe wrapper, so the
# crate's `deny(unsafe_code)` is untouched. Windows has neither flag and takes a different arm.
[target.'cfg(unix)'.dependencies]
rustix = { workspace = true, features = ["fs"] }

# The Secret Service backend speaks D-Bus through zbus rather than libdbus: the pure-Rust path needs
# no C system library at build time, and its error type is the one that separates "nothing owns the
# name" from "collection locked", which is what the backend report has to say.
[target.'cfg(any(target_os = "linux", target_os = "freebsd", target_os = "openbsd"))'.dependencies]
zbus-secret-service-keyring-store = { workspace = true, features = ["rt-async-io-crypto-rust"] }
# Classification happens below the store, which boxes every connection failure into one variant.
# `rt-async-io-crypto-rust` names the zbus runtime here rather than relying on feature unification.
secret-service = { workspace = true, features = ["rt-async-io-crypto-rust"] }
zbus.workspace = true

[target.'cfg(target_os = "windows")'.dependencies]
windows-native-keyring-store.workspace = true
# The fallback store's directory permissions. Windows has no mode bits, so what keeps the sealed file
# out of other accounts is its access list, and nothing in the standard library sets one.
windows-sys.workspace = true

# `keychain` is the feature that attaches a store at all: without it this crate compiles to a shell
# that supports no operation, which is the Apple face of the in-memory-mock trap scripts/audit.sh
# guards against.
[target.'cfg(any(target_os = "macos", target_os = "ios"))'.dependencies]
apple-native-keyring-store = { workspace = true, features = ["keychain"] }

# Classification happens below the store here too: it maps a handful of `OSStatus` values and boxes
# every other one opaquely, and a locked keychain arrives among the others. macOS only, because
# carrying the framework crate to classify a target nothing here builds for is dead weight. iOS keeps
# the unclassified answer.
[target.'cfg(target_os = "macos")'.dependencies]
security-framework = { workspace = true }

[features]
default = ["encrypted-session"]
# Forces the Secret Service session onto the Diffie-Hellman-agreed AES transport. A dependency's
# features are not visible as a cfg, so this passthrough is what the build gate in lib.rs tests. The
# store crate it names is only in the graph on the targets that have one, and the edge is inert on the
# rest.
encrypted-session = ["zbus-secret-service-keyring-store/crypto-rust"]
# Gates the tests that need a live session bus and a real Secret Service provider. Never enabled by
# a shipping build, and never by a dependency edge: these tests write to whatever keyring is on the
# bus and one of them locks a collection, so on a developer's desktop they raise an unlock dialog and
# wait on it. Nothing may depend on this feature, or `--workspace` unifies it on and every run starts
# prompting. Test doubles go behind `mock` for exactly that reason.
testing = []
# The in-memory store, for other crates' tests. Deliberately separate from `testing`: a dev-dependency
# that turned that one on would drag the live-bus tests into every workspace run.
#
# Reachable only through dev-dependency edges, and it has to stay that way. Cargo unifies features
# across everything one invocation builds, so a `--workspace --all-targets` run already resolves a
# single apogee-secrets lib with `mock` on and links the launcher binary against it. What keeps the
# fake store out of a release is not that dev edges are special, it is that no normal edge anywhere
# selects the feature. Adding one to a shipping crate substitutes a process-lifetime map for the
# user's keyring, with a probe that still reports the store healthy. `scripts/audit.sh` asserts the
# absence off the resolved graph.
mock = []
# The fallback store's two decoders, reachable from the fuzz workspace and from nothing else. Off in
# every shipping build, so a parser entry point that takes hostile bytes is never public API.
fuzzing = []

[dev-dependencies]
# Compile-fail proof that Secret implements none of the leaking traits.
trybuild.workspace = true
# Only so the derive-Serialize compile-fail case has the derive macro in scope; the crate itself
# never serializes anything.
serde.workspace = true
tempfile.workspace = true
proptest.workspace = true

[[test]]
name = "secret_service"
required-features = ["testing"]

[[test]]
name = "secret_service_locked"
required-features = ["testing"]

[[test]]
name = "probe_no_backend"
required-features = ["testing"]

[[test]]
name = "probe_no_collection"
required-features = ["testing"]

[[test]]
name = "bus_encrypted"
required-features = ["testing"]

[[test]]
name = "foreign_import"
required-features = ["testing"]

[[test]]
name = "windows_credentials"
required-features = ["testing"]

[lints]
workspace = true
