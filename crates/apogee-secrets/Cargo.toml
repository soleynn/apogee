[package]
name = "apogee-secrets"
version = "0.0.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[dependencies]
thiserror.workspace = true
uuid.workspace = true
zeroize.workspace = true
# The fallback store's seal. Nothing else in this crate does cryptography of its own: the platform
# stores encrypt their own items, and this is the backend for the sessions that have none.
argon2.workspace = true
chacha20poly1305.workspace = true
getrandom.workspace = true
# Only to read the plaintext password file another launcher writes when it is configured to keep one.
# Nothing this crate owns is serialized: a secret that could be written into config is the leak the
# crate exists to prevent.
serde_json.workspace = true

# The Secret Service backend speaks D-Bus through zbus rather than libdbus: the pure-Rust path needs
# no C system library at build time, and its error type is the one that separates "nothing owns the
# name" from "collection locked", which is what the backend report has to say.
[target.'cfg(any(target_os = "linux", target_os = "freebsd", target_os = "openbsd"))'.dependencies]
keyring = { workspace = true, features = ["async-secret-service"] }
# Classification happens below keyring, which boxes every connection failure into one variant.
# `rt-async-io-crypto-rust` names the zbus runtime here rather than relying on feature unification.
secret-service = { workspace = true, features = ["rt-async-io-crypto-rust"] }
zbus.workspace = true

[target.'cfg(target_os = "windows")'.dependencies]
keyring = { workspace = true, features = ["windows-native"] }
# The fallback store's directory permissions. Windows has no mode bits, so what keeps the sealed file
# out of other accounts is its access list, and nothing in the standard library sets one.
windows-sys.workspace = true

[target.'cfg(any(target_os = "macos", target_os = "ios"))'.dependencies]
keyring = { workspace = true, features = ["apple-native"] }

# Classification happens below keyring here too: it maps five `OSStatus` values and boxes every other
# one opaquely, and a locked keychain arrives among the others. macOS only, because keyring resolves
# this crate's major 3 there and its major 2 on iOS, and carrying both majors to classify a target
# nothing here builds for is dead weight. iOS keeps the unclassified answer.
[target.'cfg(target_os = "macos")'.dependencies]
security-framework = { workspace = true }

[features]
default = ["encrypted-session"]
# Forces the Secret Service session onto the Diffie-Hellman-agreed AES transport. A dependency's
# features are not visible as a cfg, so this passthrough is what the build gate in lib.rs tests.
encrypted-session = ["keyring/crypto-rust"]
# Gates the tests that need a live session bus and a real Secret Service provider. Never enabled by
# a shipping build, and never by a dependency edge: these tests write to whatever keyring is on the
# bus and one of them locks a collection, so on a developer's desktop they raise an unlock dialog and
# wait on it. Nothing may depend on this feature, or `--workspace` unifies it on and every run starts
# prompting. Test doubles go behind `mock` for exactly that reason.
testing = []
# The in-memory store, for other crates' tests. Deliberately separate from `testing`: a dev-dependency
# that turned that one on would drag the live-bus tests into every workspace run.
mock = []
# The fallback store's two decoders, reachable from the fuzz workspace and from nothing else. Off in
# every shipping build, so a parser entry point that takes hostile bytes is never public API.
fuzzing = []

[dev-dependencies]
# Compile-fail proof that Secret implements none of the leaking traits.
trybuild.workspace = true
# Only so the derive-Serialize compile-fail case has the derive macro in scope; the crate itself
# never serializes anything.
serde.workspace = true
tempfile.workspace = true
proptest.workspace = true

[[test]]
name = "secret_service"
required-features = ["testing"]

[[test]]
name = "secret_service_locked"
required-features = ["testing"]

[[test]]
name = "probe_no_backend"
required-features = ["testing"]

[[test]]
name = "probe_no_collection"
required-features = ["testing"]

[[test]]
name = "bus_encrypted"
required-features = ["testing"]

[[test]]
name = "foreign_import"
required-features = ["testing"]

[[test]]
name = "windows_credentials"
required-features = ["testing"]

[lints]
workspace = true
