[package]
name = "apogee-addons"
version = "0.0.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[dependencies]
thiserror.workspace = true
async-trait.workspace = true
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
zip.workspace = true
tokio.workspace = true
tokio-util.workspace = true
tempfile.workspace = true
url.workspace = true
# The signed component manifest: parse its JSON and verify the Ed25519 signature against the compiled-in
# key before any sha256 pin inside is trusted.
ed25519-dalek.workspace = true
apogee-runtime = { path = "../apogee-runtime" }
apogee-fetch = { path = "../apogee-fetch" }

# openat/mkdirat against a held directory descriptor for restore, and signalling a process group from
# a drop for companion teardown. Both keep #![forbid(unsafe_code)].
[target.'cfg(unix)'.dependencies]
rustix = { workspace = true, features = ["fs", "process"] }

[features]
# Gates tests that need a real host `wine`; run only in the wine-present CI job.
wine-integration = []

[dev-dependencies]
insta.workspace = true
apogee-test-support = { path = "../apogee-test-support" }
tokio-util.workspace = true
serial_test.workspace = true
# A prefix handle over a scratch directory, so the install tests need no real wine.
apogee-runtime = { path = "../apogee-runtime", features = ["testing"] }
zip.workspace = true

[[test]]
name = "verb_wine"
required-features = ["wine-integration"]

[lints]
workspace = true
