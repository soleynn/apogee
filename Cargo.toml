[workspace]
resolver = "3"
members  = ["crates/*", "apps/apogee-cli", "apps/apogee-elevated"]

[workspace.package]
edition      = "2024"
# What the source actually needs, not a floor anyone supports: the pinned toolchain is the one this
# builds with. Raised to 1.89 for `std::fs::File::lock`, which is how the fallback secret store keeps
# two launcher processes from writing over each other without taking a C locking crate.
rust-version = "1.89"
license      = "GPL-3.0-or-later"

[workspace.dependencies]
# foundation runtime
thiserror        = "2"
async-trait      = "0.1"
tokio            = { version = "1", features = ["rt-multi-thread", "macros", "process", "fs", "io-util", "sync", "time", "net"] }
tokio-stream     = "0.1"
tokio-util       = "0.7"
futures-util     = "0.3"
bytes            = "1"
# `rustls-tls` on its own resolves to `rustls-tls-webpki-roots`, a Mozilla root set compiled into the
# binary, and the platform's own trust store is then never read. That is invisible until something
# depends on it: `APOGEE_TLS_SYSTEM_ROOTS` exists so a user behind a TLS-intercepting proxy can put
# the launcher back on this machine's roots, and against a webpki-only build it restored a list that
# cannot contain a locally installed root, so the one escape hatch from the anchor set landed the user
# exactly where they started. `rustls-tls-native-roots` adds the platform store beside it.
#
# That widens every client that is not anchored (patch fetch, catalog fetch, addon downloads) from
# Mozilla's set to Mozilla's set plus whatever this machine has been given, which is the ordinary
# posture for a desktop program and is deliberate rather than incidental: those hosts are reached over
# TLS but trusted through Ed25519 signatures and sha256 pins, and restricting them to webpki would
# leave the intercepted user with a launcher that logs in and then cannot download anything. It does
# not widen the anchored one, where the credential is: `tls_built_in_root_certs(false)` turns both
# sets off, which `crates/apogee-core/src/trust.rs` asserts against a root the machine does trust.
reqwest          = { version = "0.12", default-features = false, features = ["rustls-tls", "rustls-tls-native-roots", "gzip", "deflate", "http2", "stream"] }
serde            = { version = "1", features = ["derive"] }
serde_json       = "1"
sha1             = "0.11"
# Dalamud's distribution authenticates its trees with an MD5 map and its assets with SHA1, so both
# digests are needed to check what it serves. RustCrypto, same family as sha1/sha2.
md-5             = "0.11"
sha2             = "0.11"
# The whole-file digest our own signed manifests pin artifacts under. `pure` is deliberate and it
# costs something: this crate's AVX-512 and NEON kernels are C reached through a `cc` build script,
# and `pure` compiles neither, so x86_64 gets its Rust SSE2/SSE4.1/AVX2 kernels and everything else
# gets the portable one. What it buys is a binary that does not depend on what the build machine
# happened to have installed: without `pure` the crate probes for a C compiler and falls back to the
# same Rust kernels when it finds none, so one source tree would produce two different binaries with
# nothing anywhere saying which one this is.
blake3           = { version = "1", default-features = false, features = ["std", "pure"] }
crc32fast        = "1"
http             = "1"
url              = "2"
percent-encoding = "2"
uuid             = { version = "1", features = ["v4", "serde"] }
tracing          = "0.1"
# The CLI's log subscriber, and the only consumer of the `tracing` events the libraries emit. Default
# features off and `env-filter` deliberately not among them: that feature's directive parser is built
# on `regex-automata`, and `filter::Targets` accepts the same `target=level` syntax without it.
tracing-subscriber = { version = "0.3", default-features = false, features = ["fmt", "registry", "std"] }
zeroize          = { version = "1", features = ["derive"] }
# domain-adjacent, gated to the crates that use them.
# The credential-store API, without any store attached. Its umbrella crate, `keyring`, is deliberately
# not used: it selects the stores, and a target naming none of its features gets an in-memory mock
# that answers every call. Its own documentation sends an application that picks its own backends
# here instead, which is what apogee-secrets does, one store crate per target below.
keyring-core     = "1"
# The three stores, each selected by the target block that names it. Every classification this
# workspace does reads the error the store boxed, by downcasting to a type both sides must have got
# from the same package, so each store's own backend crate is pinned alongside it and scripts/audit.sh
# asserts the resolver handed out one copy rather than two. That split is not a compile error: it
# fails a downcast at runtime and flattens every condition into an opaque failure.
zbus-secret-service-keyring-store = "1"
apple-native-keyring-store       = "1"
windows-native-keyring-store     = "1"
# The Secret Service client the Linux store is built on, taken directly as well: the probe reports the
# store's condition without going through a credential at all, and the import reads keys another
# launcher owns. Must resolve to the single version the store crate picks.
secret-service   = "5"
# The D-Bus error names the classification above reads. Already in the graph under secret-service;
# named here so the match is on typed variants rather than on a rendered string.
zbus             = "5"
# The Keychain's side of the same problem: the Apple store maps a handful of status codes and boxes
# every other one opaquely, and a locked keychain is among the others. Only `base::Error`, which
# carries the code, is used, so the TLS-oriented default features are off. Must resolve to the version
# that store picks or the downcast that reads the code silently never matches.
security-framework = { version = "3", default-features = false }
# RFC 6238 code generation. The `otpauth` feature is deliberately never enabled by any member: its
# URI parser unwraps the host of an authority-less URI, so a pasted `otpauth:totp/x` takes the whole
# process down, and the crate that needs URIs parses them itself.
totp-rs          = "5"
# The transport encoding a shared one-time-password secret arrives in. Taken directly rather than
# through totp-rs's own wrapper, whose equality operator unwraps a decode and whose `Display` renders
# the key.
base32           = "0.5"
# The fallback secret store's key derivation and its seal, gated to apogee-secrets. Foundation
# cryptography used like a standard library, same RustCrypto generation as sha1/sha2/md-5 above.
# Default features are off on both: the AEAD's random-nonce adapter is unused, and argon2's `alloc`
# pulls a password-string encoder this never writes and hands the algorithm its working memory in a
# buffer that is dropped un-erased.
argon2           = { version = "0.5", default-features = false, features = ["zeroize"] }
chacha20poly1305 = { version = "0.11", default-features = false, features = ["zeroize"] }
# Salts and nonces come from the operating system generator directly: no seeded generator, so there
# is no seed to get wrong and no state to fork across a process.
getrandom        = "0.4"
flate2           = "1"
# Ed25519 verification for signed manifests (runner/component catalogs), checked against a
# compiled-in key before any sha256 pin is trusted.
ed25519-dalek    = "3"
# safe syscall wrappers (monotonic clock now; /proc + signals later), keeping #![forbid(unsafe_code)]
rustix           = "1"
# The one Win32 surface with no standard-library equivalent: the security descriptor that decides who
# can reach the fallback secret store's directory, which is what a mode is on the other platforms.
# Microsoft's own bindings, already resolved here under several transitive edges. Gated to
# apogee-secrets and to `cfg(windows)`, and the sole reason that crate is `deny(unsafe_code)`.
windows-sys      = { version = "0.61", features = ["Win32_Security_Authorization"] }
# config-backup container, gated to apogee-addons. Default features off on purpose: the `time`
# feature makes the default write options stamp the wall clock, which would make archives
# unreproducible.
zip              = { version = "8", default-features = false, features = ["deflate-flate2"] }
# in-process, pure-Rust streaming archive decoders for runner tarballs (no system tar, no C linkage)
tar              = "0.4"
lzma-rs          = "0.3"
ruzstd           = "0.9"
# work-stealing data parallelism for the block-index CRC sweep (build + verify), gated to apogee-zipatch
rayon            = "1"
# CLI: argument parsing and a no-echo password prompt, gated to the apogee-cli app.
clap             = { version = "4", features = ["derive"] }
rpassword        = "7"
# in-repo streaming test HTTP server (the download harness), gated to apogee-test-support
hyper            = { version = "1", features = ["server", "http1"] }
hyper-util       = { version = "0.1", features = ["tokio"] }
http-body-util   = "0.1"
tokio-rustls     = { version = "0.26", default-features = false, features = ["ring", "tls12", "logging"] }
rcgen            = { version = "0.14", default-features = false, features = ["crypto", "ring", "pem"] }
# dev / test
insta            = "1"
rstest           = "0.26"
proptest         = "1"
tempfile         = "3"
serial_test      = "3"
# Forward-declared for test types not yet wired up: wiremock backs an HTTP-mock transport,
# assert_cmd + predicates a CLI end-to-end harness.
wiremock         = "0.6"
assert_cmd       = "2"
predicates       = "3"
trybuild         = "1"

[workspace.lints.rust]
# `deny` rather than `forbid` for exactly one carve-out: the Windows arm of the fallback secret
# store's on-disk permissions calls advapi32 to put an owner-only access list on the store's
# directory, and the standard library exposes no security-descriptor API to do it in safe Rust.
# Every crate root still carries its own `#![forbid(unsafe_code)]` except that one, and
# `scripts/audit.sh` fails on an `unsafe` block anywhere but there, so the carve-out cannot spread
# quietly to the test targets this relaxation also covers.
unsafe_code = "deny"

[workspace.lints.clippy]
unwrap_used = "deny"
expect_used = "deny"
panic       = "deny"
exit        = "deny"
dbg_macro   = "deny"
