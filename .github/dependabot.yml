version: 2
updates:
  # The desktop shell resolves its own dependency graph from a manifest and a lockfile of its own,
  # outside the root workspace, so both directories are listed. One entry with one group yields a
  # single pull request that updates both lockfiles, instead of two that collide on the same crates.
  # Breaking updates (a new major, or a new minor below 1.0) get a second group of their own, since an
  # update outside every group is raised once per directory.
  - package-ecosystem: cargo
    directories:
      - "/"
      - "/apps/apogee/src-tauri"
    schedule:
      interval: monthly
    cooldown:
      default-days: 7
    open-pull-requests-limit: 2
    commit-message:
      prefix: "chore(deps)"
    groups:
      cargo:
        update-types:
          - "minor"
          - "patch"
      cargo-major:
        update-types:
          - "major"
    # Three crates the desktop shell cannot move on its own; patch releases still come through.
    # wry and rfd are the copies Tauri links, so a newer one of either only adds a second copy beside
    # Tauri's: they move when a Tauri release moves them. Newer nix takes an owned or borrowed
    # descriptor in fcntl, and the shell's instance lock keeps a raw one inherited across a re-exec,
    # which only unsafe code could wrap. Drop that entry if the lock stops holding a raw descriptor.
    ignore:
      - dependency-name: "wry"
        update-types:
          - "version-update:semver-major"
          - "version-update:semver-minor"
      - dependency-name: "rfd"
        update-types:
          - "version-update:semver-major"
          - "version-update:semver-minor"
      - dependency-name: "nix"
        update-types:
          - "version-update:semver-major"
          - "version-update:semver-minor"

  - package-ecosystem: npm
    directory: "/apps/apogee"
    schedule:
      interval: monthly
    cooldown:
      default-days: 7
    open-pull-requests-limit: 2
    commit-message:
      prefix: "chore(deps)"
    groups:
      npm:
        update-types:
          - "minor"
          - "patch"
      npm-major:
        update-types:
          - "major"
    # svelte-check accepts TypeScript 5 or 6 as its peer, so a TypeScript 7 bump cannot install.
    # Remove this once a svelte-check release widens that range.
    ignore:
      - dependency-name: "typescript"
        versions:
          - "7.x"

  # The local composite action pins an action of its own, which a scan of the workflows alone misses.
  - package-ecosystem: github-actions
    directories:
      - "/"
      - "/.github/actions/rust-toolchain"
    schedule:
      interval: monthly
    cooldown:
      default-days: 7
    open-pull-requests-limit: 2
    commit-message:
      prefix: "chore(deps)"
    groups:
      actions:
        patterns:
          - "*"
