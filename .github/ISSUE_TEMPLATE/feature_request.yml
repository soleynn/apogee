name: Feature request
description: Suggest an idea or an improvement
labels: [enhancement]
body:
  - type: textarea
    id: what
    attributes:
      label: What would you like
      description: A short description of the feature or change.
    validations:
      required: true
  - type: textarea
    id: why
    attributes:
      label: Why
      description: The problem it solves or the use case.
    validations:
      required: true
