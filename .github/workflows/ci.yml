name: CI

on:
  push:
    branches: [main]
  pull_request:

# Cancel superseded runs on the same ref instead of letting them pile up.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  CARGO_NET_RETRY: "10"
  RUSTUP_MAX_RETRIES: "10"

permissions:
  contents: read

jobs:
  # Which expensive jobs are worth running for this change. Computed with git rather than a third
  # party action so there is nothing extra to pin or audit.
  changes:
    name: changes
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      fuzz: ${{ steps.filter.outputs.fuzz }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - id: filter
        env:
          # Empty on a push to main, where everything runs.
          BASE_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || '' }}
        run: |
          if [ -z "$BASE_SHA" ]; then
            echo "fuzz=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          # The crates behind the fuzz targets, plus the fuzz workspace itself, plus this workflow
          # file: an edit to the fuzz jobs would otherwise run for the first time on main. Every
          # crate name has to be a real directory: `crates/sqex-cryptography` matched nothing, and a
          # crate left off this list means a change to it skips the target that covers it.
          if git diff --name-only "$BASE_SHA"...HEAD | grep -qE '^(\.github/workflows/ci\.yml|fuzz/|crates/(sqex-proto|sqex-crypto|apogee-fetch|apogee-sqpack|apogee-zipatch|apogee-patcher|apogee-runtime|apogee-addons|apogee-secrets|apogee-otp)/)'; then
            echo "fuzz=true" >> "$GITHUB_OUTPUT"
          else
            echo "fuzz=false" >> "$GITHUB_OUTPUT"
          fi

  fmt:
    name: fmt
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772 # master # zizmor: ignore[ref-version-mismatch]
        with:
          toolchain: "1.97.0"
          components: rustfmt
      - run: cargo fmt --all --check
      # The dev tools are separate workspaces, so --all skips them; format-check them too.
      - run: cargo fmt --manifest-path tools/sqex-proto-probe/Cargo.toml --all --check
      - run: cargo fmt --manifest-path tools/boot-check/Cargo.toml --all --check
      - run: cargo fmt --manifest-path tools/catalog-sign/Cargo.toml --all --check

  clippy:
    name: clippy
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772 # master # zizmor: ignore[ref-version-mismatch]
        with:
          toolchain: "1.97.0"
          components: clippy
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - run: cargo clippy --all-targets --all-features -- -D warnings
      # Lint the dev tools too (separate workspaces the run above misses), so the probe cannot rot on
      # a sqex-proto API change without CI noticing.
      - run: cargo clippy --manifest-path tools/sqex-proto-probe/Cargo.toml --all-targets -- -D warnings
      - run: cargo clippy --manifest-path tools/boot-check/Cargo.toml --all-targets -- -D warnings
      - run: cargo clippy --manifest-path tools/catalog-sign/Cargo.toml --all-targets -- -D warnings

  test-linux:
    name: test-linux
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772 # master # zizmor: ignore[ref-version-mismatch]
        with:
          toolchain: "1.97.0"
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - uses: taiki-e/install-action@7f4eb899022d8fe70b20c4f3de697aa85c309026 # v2.85.11
        with:
          tool: nextest
      - run: cargo nextest run --profile ci --workspace --no-tests=pass
      - run: cargo test --workspace --doc
      # The unverified-download-over-TLS test needs a client that trusts a loopback test certificate,
      # exposed only behind apogee-fetch's test-only `testing` feature, so it runs as its own step.
      - run: cargo test -p apogee-fetch --features testing --test none_over_tls
      # The https-to-plaintext redirect refusal needs a TLS listener to downgrade away from, so it
      # needs the same loopback-trusting client and rides the same gate.
      - run: cargo test -p apogee-fetch --features testing --test redirect_tls
      # Same reason: the component-manifest fetch is checked over TLS against a loopback certificate. It
      # is what pins the property that a manifest edit reaches the client at all.
      - run: cargo test -p apogee-addons --features testing --test manifest_fetch
      # Dalamud's whole install pipeline against a distribution served entirely from loopback, for the
      # same reason. Its own step because a gated test that nothing runs still compiles under clippy and
      # so passes silently, which is the one failure mode a feature gate introduces.
      - run: cargo test -p apogee-addons --features testing --test dalamud_fetch
      # The runner catalog's equivalent. This one already rides along with the workspace run above,
      # because apogee-addons dev-depends on apogee-runtime with `testing` on and that resolves
      # workspace-wide. Named anyway so the coverage does not rest on another crate's dev-dependency.
      - run: cargo test -p apogee-runtime --features testing --test catalog_fetch
      # The corpus fetcher lives behind the `corpus` feature (off by default so it stays out of the
      # plain and cross builds); its self-test is hermetic (chaos-server-backed, no network).
      - run: cargo test -p apogee-test-support --features corpus corpus
      # The CLI patch e2e drives a real chaos-served patch download-and-apply through the built binary;
      # it needs the test-only `fixtures` feature (scripted transport), so it runs as its own step. No
      # wine (the patch command never launches), so it belongs in the hermetic job, not the wine one.
      - run: cargo test -p apogee-cli --features fixtures --test patch_e2e
      # The sealed secret file through the binary: created behind a typed confirmation, written to,
      # re-sealed, and destroyed. Same feature and the same reason (the passphrase and the account
      # password both come from the fixture environment, so no terminal is in the loop), and the same
      # trap: a gated test nothing runs still compiles under clippy and passes silently.
      - run: cargo test -p apogee-cli --features fixtures --test secrets_file
      # Where a one-time code may enter the binary: stdin only, never an argument. Same feature and
      # the same reason again (the account password comes from the fixture environment), and it needs
      # the scripted login to reach the gate at all.
      - run: cargo test -p apogee-cli --features fixtures --test otp

  # Process supervision on stock wine: launches a stub PE and proves the /proc scanner resolves it,
  # kills it targeted, and that wineserver -k is the separate broad stop. The scanner logic is also
  # covered hermetically in test-linux without wine, but only a real wine run exercises the /proc
  # resolution. Every step runs single-threaded with WINEDEBUG=-all to keep headless wine
  # deterministic; if real-wine startup ever proves flaky, wrap the wine steps in a bounded retry
  # rather than making the job advisory. The CLI end-to-end proof lives in its own job beside this
  # one, so the wine wall clock is the larger half rather than the sum.
  test-linux-wine:
    name: test-linux-wine
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772 # master # zizmor: ignore[ref-version-mismatch]
        with:
          toolchain: "1.97.0"
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          key: wine
          save-if: ${{ github.ref == 'refs/heads/main' }}
      # Host wine runs the game; the MinGW cross-compiler builds the stub PE the test launches.
      - name: Install wine and the MinGW cross toolchain
        run: |
          sudo dpkg --add-architecture i386
          sudo apt-get update
          sudo apt-get install -y wine64 wine gcc-mingw-w64-x86-64
      - name: Supervision under stock wine
        env:
          WINEDEBUG: "-all"
        run: cargo test -p apogee-runtime --features wine-integration --test supervise_wine -- --test-threads=1
      # Prefix lifecycle on stock wine: wineboot -i is recorded, a broken prefix is targeted-fixed
      # without a delete, and in-process path translation round-trips against the winepath oracle.
      - name: Prefix lifecycle under stock wine
        env:
          WINEDEBUG: "-all"
        run: cargo test -p apogee-runtime --features wine-integration --test prefix_wine -- --test-threads=1
      # Running a setup program inside a prefix: `reg` resolves as a program there, a write is visible to
      # a later read, and repeating it succeeds rather than blocking on an overwrite prompt.
      - name: Prefix setup programs under stock wine
        env:
          WINEDEBUG: "-all"
        run: cargo test -p apogee-runtime --features wine-integration --test prefix_program_wine -- --test-threads=1
      # The shipped prefix verb applied to a real prefix three times: applied, a no-op, and applied again
      # over a value already set, which is the part the prefix's own record cannot stand in for.
      - name: Prefix verbs under stock wine
        env:
          WINEDEBUG: "-all"
        run: cargo test -p apogee-addons --features wine-integration --test verb_wine -- --test-threads=1

  # End-to-end on stock wine: the CLI logs in against scripted fixtures and launches a stub game
  # through system wine, resolving the real process and killing it. This is the login → register →
  # launch proof and the output leak detector. It is the longest single wine step, so it runs as its
  # own job beside test-linux-wine instead of serializing after those suites.
  test-linux-wine-e2e:
    name: test-linux-wine-e2e
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772 # master # zizmor: ignore[ref-version-mismatch]
        with:
          toolchain: "1.97.0"
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          key: wine-e2e
          save-if: ${{ github.ref == 'refs/heads/main' }}
      # Host wine runs the game; the MinGW cross-compiler builds the stub PE the test launches.
      - name: Install wine and the MinGW cross toolchain
        run: |
          sudo dpkg --add-architecture i386
          sudo apt-get update
          sudo apt-get install -y wine64 wine gcc-mingw-w64-x86-64
      - name: CLI login and launch under stock wine
        env:
          WINEDEBUG: "-all"
        run: cargo test -p apogee-cli --features wine-integration --test e2e -- --test-threads=1

  # A real credential store in headless CI. The three conditions the store has to tell apart (an
  # unlocked round trip, a locked collection, a bus with no provider on it) plus the proof of what
  # actually crosses the socket. The classification is unit-tested hermetically in test-linux, but
  # only a real provider produces the errors it classifies, and only a real socket shows whether the
  # secret crossed it in the clear.
  #
  # Required by the branch ruleset, unlike the other store jobs: this one reads no secret of the
  # repository's and installs its provider from apt, so gating merges on it costs nothing.
  test-linux-secret-service:
    name: test-linux-secret-service
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772 # master # zizmor: ignore[ref-version-mismatch]
        with:
          toolchain: "1.97.0"
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          key: secret-service
          save-if: ${{ github.ref == 'refs/heads/main' }}
      # `dbus` carries dbus-run-session; socat is the relay the wire capture reads through. No
      # libsecret: the client speaks D-Bus directly and links nothing.
      - name: Install a session bus, a credential store, and the bus relay
        run: |
          sudo apt-get update
          sudo apt-get install -y dbus gnome-keyring socat
      # Build outside the bus session, so a compile error cannot look like a bus failure.
      - run: cargo test -p apogee-secrets --features testing --no-run
      # The unlock password has to be non-empty: an empty one leaves the daemon holding only its
      # in-memory collection, and every call then fails in a way that reads as a locked store.
      # XDG_DATA_HOME is a temp dir so running this same command locally cannot touch a real keyring.
      - name: Round trip against an unlocked store
        run: |
          export XDG_DATA_HOME="$(mktemp -d)"
          dbus-run-session -- bash -c '
            echo -n "apogee-ci" | gnome-keyring-daemon --unlock --components=secrets
            cargo test -p apogee-secrets --features testing --test secret_service -- --test-threads=1
          '
      # The import reads keys another launcher owns, so these cases seed the item onto the bus
      # directly instead of writing it through this crate. A test that wrote it with the same code
      # that reads it would pass whatever key strings it used, which is the one thing worth proving.
      - name: Import a password another launcher stored
        run: |
          export XDG_DATA_HOME="$(mktemp -d)"
          dbus-run-session -- bash -c '
            echo -n "apogee-ci" | gnome-keyring-daemon --unlock --components=secrets
            cargo test -p apogee-secrets --features testing --test foreign_import -- --test-threads=1
          '
      # Locking is one-way here: unlocking again needs a prompt a headless session cannot answer, so
      # this gets a keyring of its own and leaves it locked behind it. The probe and a write are both
      # asserted: the write is refused outright, and that refusal is the only live check anywhere that
      # the store still reports a locked collection as locked. Reads past the lock are the ones left
      # out, because resolving a stored item raises that prompt and then waits on it for an
      # unpredictable time; their classifications are pinned by unit tests instead.
      - name: A locked store probes as locked and refuses a write
        run: |
          export XDG_DATA_HOME="$(mktemp -d)"
          # The opt-in the test refuses to run without. It is set here and nowhere else: the keyring
          # below is a throwaway on a private bus, and the same test against a desktop session would
          # lock the user's real login keyring with no way to unlock it again.
          export APOGEE_KEYRING_LOCK_OK=1
          dbus-run-session -- bash -c '
            echo -n "apogee-ci" | gnome-keyring-daemon --unlock --components=secrets
            cargo test -p apogee-secrets --features testing --test secret_service_locked -- --test-threads=1
          '
      # No unlock here, deliberately: the daemon then never creates a login keyring, so the default
      # collection does not resolve. That is what a passwordless or autologin session looks like, and
      # it is the shape that reads as healthy unless the probe resolves the same collection the store
      # writes to. The in-memory session collection is always present and always unlocked.
      - name: Probe a provider that has never been initialized
        run: |
          export XDG_DATA_HOME="$(mktemp -d)"
          dbus-run-session -- bash -c '
            gnome-keyring-daemon --components=secrets &
            sleep 2
            cargo test -p apogee-secrets --features testing --test probe_no_collection -- --test-threads=1
          '
      # This leg needs its own bus. With a keyring installed, D-Bus activates the credential store on
      # demand from its service file, so an empty service directory is the only way to get a session
      # that genuinely cannot produce one.
      - name: Probe a bus that cannot produce a credential store
        run: |
          conf="$(mktemp)"
          svc="$(mktemp -d)"
          cat > "$conf" <<EOF
          <!DOCTYPE busconfig PUBLIC "-//freedesktop//DTD D-BUS Bus Configuration 1.0//EN"
           "http://www.freedesktop.org/standards/dbus/1.0/busconfig.dtd">
          <busconfig>
            <type>session</type>
            <listen>unix:tmpdir=/tmp</listen>
            <servicedir>$svc</servicedir>
            <!-- receive_sender is not optional: without it the daemon drops every reply and any
                 client hangs waiting for one it will never get. -->
            <policy context="default">
              <allow send_destination="*"/>
              <allow receive_sender="*"/>
              <allow own="*"/>
            </policy>
          </busconfig>
          EOF
          dbus-run-session --config-file="$conf" -- \
            cargo test -p apogee-secrets --features testing --test probe_no_backend -- --test-threads=1
      # The client talks to a relay socket rather than the bus socket, so the raw stream is on disk
      # afterwards: the secret must not be in it and the encrypted transport must be named in it.
      - name: What crosses the session bus
        run: |
          export XDG_DATA_HOME="$(mktemp -d)"
          export APOGEE_BUS_CAPTURE="$(mktemp -d)"
          dbus-run-session -- bash -c '
            echo -n "apogee-ci" | gnome-keyring-daemon --unlock --components=secrets
            real="${DBUS_SESSION_BUS_ADDRESS#unix:path=}"; real="${real%%,*}"
            socat -r "$APOGEE_BUS_CAPTURE/c2s.bin" -R "$APOGEE_BUS_CAPTURE/s2c.bin" \
              UNIX-LISTEN:"$APOGEE_BUS_CAPTURE/bus.sock",fork UNIX-CONNECT:"$real" &
            relay=$!
            sleep 1
            DBUS_SESSION_BUS_ADDRESS="unix:path=$APOGEE_BUS_CAPTURE/bus.sock" \
              cargo test -p apogee-secrets --features testing --test bus_encrypted -- --test-threads=1
            status=$?
            kill "$relay" 2>/dev/null || true
            exit "$status"
          '

  # The desktop shell, which is a workspace of its own and so is reached by none of the jobs above:
  # `cargo fmt --all`, `cargo clippy --all-targets` and the workspace test run all stop at the root
  # workspace's members, and this is not one of them. That separation is the point rather than an
  # accident. It keeps the window framework out of `build-windows-cross`, where it does not build at
  # all, and it keeps the three development packages installed below out of every other job here.
  #
  # Step order is load-bearing: the frontend bundle has to exist on disk before anything Rust is
  # compiled, because the macro that builds the window's context embeds that directory and fails the
  # build when it is missing. So `npm run build` comes before `cargo fmt`, not after it.
  #
  # No display and no window is opened. What this proves is that the shell compiles, that its lint
  # table holds, that its unit tests and the frontend's pass, and that its dependency graph clears
  # the licence and advisory policy beside it. Driving a real window needs a display server and is a
  # separate job.
  shell:
    name: shell
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772 # master # zizmor: ignore[ref-version-mismatch]
        with:
          toolchain: "1.97.0"
          components: rustfmt, clippy
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: lts/*
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: apps/apogee/src-tauri
          key: shell
          save-if: ${{ github.ref == 'refs/heads/main' }}
      # The webview, its JavaScript engine and the HTTP library that framework links against. Named
      # by their development packages rather than pulled in by a helper action, so what the build
      # links is visible here.
      - name: Install the webview development packages
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libwebkit2gtk-4.1-dev libjavascriptcoregtk-4.1-dev libsoup-3.0-dev
      - name: Install the frontend's dependencies
        run: npm ci
        working-directory: apps/apogee
      - name: Frontend type check
        run: npm run check
        working-directory: apps/apogee
      - name: Frontend tests
        run: npm run test
        working-directory: apps/apogee
      # Before the Rust steps: they embed this directory.
      - name: Frontend build
        run: npm run build
        working-directory: apps/apogee
      - run: cargo fmt --manifest-path apps/apogee/src-tauri/Cargo.toml --all --check
      - run: cargo clippy --manifest-path apps/apogee/src-tauri/Cargo.toml --all-targets -- -D warnings
      - run: cargo test --manifest-path apps/apogee/src-tauri/Cargo.toml
      # The shell resolves its own graph, so the policy beside its manifest is the one that applies;
      # the `deny` job above reads the root workspace's and never sees this one.
      - uses: EmbarkStudios/cargo-deny-action@3c6349835b2b7b196a839186cb8b78e02f7b5f25 # v2.1.1
        with:
          manifest-path: apps/apogee/src-tauri/Cargo.toml

  build-windows-cross:
    name: build-windows-cross
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772 # master # zizmor: ignore[ref-version-mismatch]
        with:
          toolchain: "1.97.0"
          targets: x86_64-pc-windows-gnu
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          key: windows-cross
          save-if: ${{ github.ref == 'refs/heads/main' }}
      # The GNU/MinGW ABI cross-compiles from a plain apt package: no MSVC SDK download, no llvm-lib,
      # no EULA. The Windows components run under Wine, where GNU-ABI binaries are fine.
      - name: Install the MinGW-w64 cross toolchain
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends gcc-mingw-w64-x86-64 g++-mingw-w64-x86-64
      - run: cargo build --target x86_64-pc-windows-gnu --workspace

  # The one path no other job can reach. `build-windows-cross` runs `cargo build`, not
  # `--all-targets`, so a Windows test target is never even type-checked there, and the credential
  # store the import reads exists only here. Advisory: the branch ruleset's required contexts are
  # fixed, and adding one is a separate change.
  test-windows-credential-store:
    name: test-windows-credential-store
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772 # master # zizmor: ignore[ref-version-mismatch]
        with:
          toolchain: "1.97.0"
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          key: windows-credential-store
          save-if: ${{ github.ref == 'refs/heads/main' }}
      # Seeded with the platform's own tool rather than through this crate, for the same reason the
      # bus job seeds its item directly: a fixture written by the code under test proves only that it
      # agrees with itself, and the target string is the whole contract.
      #
      # `cmdkey` writes the blob as UTF-16, which is what the store this reads holds text in.
      # The shell is named on purpose. The legacy target contains spaces, and the quoting that
      # survives to `cmdkey` differs between the two shells: quoted the other way the credential is
      # filed under a name the test then cannot find, which is a green seeding step and a red test.
      # Nothing here is interpolated and nothing is attacker-controlled.
      - name: Seed a credential the way the other launcher would
        shell: cmd # zizmor: ignore[misfeature] quoting for a target with spaces, no interpolation
        run: |
          cmdkey /generic:XIVLAUNCHER-ci-current /user:ci-current /pass:current-password
          cmdkey /generic:"FINAL FANTASY XIV-ci-legacy" /user:ci-legacy /pass:legacy-password
      # The lib's own tests run here too, and only here: the blob decode is Windows-gated, so
      # `--test windows_credentials` alone would build the lib as a plain dependency and never
      # compile it. Named separately because the other integration targets in this crate need a
      # session bus and do not build on this platform.
      - run: cargo test -p apogee-secrets --features mock --lib
      - run: cargo test -p apogee-secrets --features testing --test windows_credentials -- --test-threads=1

  # The elevated patch worker, on the only platform it exists for. Nothing else in this file can
  # reach it: the writability probe needs a real access-control entry, the transport is a named pipe,
  # and the anti-crash test needs a real process to terminate. `build-windows-cross` does not stand
  # in for any of that, and its `cargo build` never type-checks a Windows-only test target either.
  #
  # Three packages rather than the workspace, on purpose. Other crates carry Windows test targets
  # that do not compile today, which is the gap that same `cargo build` has been hiding; fixing them
  # is not this change's to do, and widening the job would only mean pinning that breakage here.
  #
  # No ABI matrix. The elevation path reaches no foreign function, links no artifact and loads no
  # library, so there is nothing in it that a GNU build would exercise differently from an MSVC one;
  # `build-windows-cross` already compiles it for the GNU ABI. A matrix here would run one axis
  # twice.
  #
  # What this job cannot prove, and what no hosted runner can: the agent already holds an
  # administrator token, so an elevation request is granted with no consent dialog and no integrity
  # transition. The plumbing around the hop is covered; the moment a user actually sees is not.
  #
  # Advisory, like the credential-store jobs: the branch ruleset's required contexts are fixed, and
  # promoting one is a separate change.
  test-windows-elevated-worker:
    name: test-windows-elevated-worker
    runs-on: windows-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772 # master # zizmor: ignore[ref-version-mismatch]
        with:
          toolchain: "1.97.0"
          components: clippy
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          key: windows-elevated-worker
          save-if: ${{ github.ref == 'refs/heads/main' }}
      # First: the type check no other job performs. `--all-targets` is the whole point.
      - run: cargo clippy -p apogee-elevate -p apogee-elevated -p apogee-patcher --all-targets -- -D warnings
      - run: cargo test -p apogee-elevate
      # The shipping worker binary driven as a real process against a real NT filesystem: the
      # protocol, the re-verification, the confinement, the named pipe, the elevation request, a
      # cancel mid-apply, and a kill mid-apply or mid-repair that must leave this process running and
      # the version file where it was. Both pipelines end to end here as well, so an install and a
      # repair routed through the worker are compared against the same ones run in process, on the
      # filesystem whose path rules and file sharing are the reason this job exists at all.
      - run: cargo test -p apogee-elevated
      # The probe against a directory `icacls` genuinely denies, plus the unit tests either side of
      # it. The crate's other integration targets are Linux-proven and add no Windows-specific claim.
      - run: cargo test -p apogee-patcher --lib --test write_probe_windows

  # The launch arm on the only platform it exists for. None of what it asserts survives a cross-build:
  # the compatibility layers are read out of the environment a real child was given (Windows re-spells
  # them on the way in, which is the engine having seen them), and the session's wait and kill are the
  # child handle driven against a process that has to actually stop.
  #
  # `-p apogee-runtime` rather than the workspace, for the reason the job above names: other crates
  # carry Windows test targets that do not compile today.
  #
  # Advisory, like the jobs above: the branch ruleset's required contexts are fixed, and promoting one
  # is a separate change.
  test-windows-launch:
    name: test-windows-launch
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772 # master # zizmor: ignore[ref-version-mismatch]
        with:
          toolchain: "1.97.0"
          components: clippy
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          key: windows-launch
          save-if: ${{ github.ref == 'refs/heads/main' }}
      # The type check no other job performs: `build-windows-cross` runs `cargo build`, which never
      # reaches a test target.
      - run: cargo clippy -p apogee-runtime --all-targets -- -D warnings
      # The unit tests come along because this is the only job that runs them for Windows at all; the
      # crate's other integration targets are Linux-only and compile away to nothing here.
      - run: cargo test -p apogee-runtime --lib --test launch_windows

  # The Apple targets the crate declares support for, type-checked. There is no hardware for them
  # anywhere in this repository and no cross-compiler either: the Keychain backend links system
  # frameworks, so `build-windows-cross`'s trick does not carry over. Checking does, and it is what
  # catches the failure that matters, because the code under those cfgs is otherwise compiled by
  # nothing and can rot silently. `-p apogee-secrets` rather than the workspace: it is the only crate
  # with an Apple-specific line in it, and everything else here reaches a C dependency that needs an
  # Apple SDK to build. Which store keyring actually resolves for these targets is a graph property
  # rather than a compile one, so `scripts/audit.sh` asserts it and this job does not.
  #
  # Advisory, like the two credential-store jobs: the branch ruleset's required contexts are fixed,
  # and adding one is a separate change.
  check-apple-cross:
    name: check-apple-cross
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772 # master # zizmor: ignore[ref-version-mismatch]
        with:
          toolchain: "1.97.0"
          targets: aarch64-apple-darwin,x86_64-apple-darwin
          components: clippy
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          key: apple-cross
          save-if: ${{ github.ref == 'refs/heads/main' }}
      # `mock` and not `--all-features`: the `testing` targets are integration tests against a live
      # session bus, and they name a crate that is not a dependency on these targets at all.
      - run: cargo clippy -p apogee-secrets --features mock --all-targets --target aarch64-apple-darwin -- -D warnings
      - run: cargo clippy -p apogee-secrets --features mock --all-targets --target x86_64-apple-darwin -- -D warnings

  deny:
    name: deny
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: EmbarkStudios/cargo-deny-action@3c6349835b2b7b196a839186cb8b78e02f7b5f25 # v2.1.1

  audit:
    name: audit
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772 # master # zizmor: ignore[ref-version-mismatch]
        with:
          toolchain: "1.97.0"
      - run: bash scripts/audit.sh

  # The hostile-input fuzz smoke, split into four jobs grouped by the crates their targets build, so
  # a run's wall clock is one shard rather than the sum of all twenty-six targets. Only the parsers
  # fed hostile input can regress these; a change that touches none of their crates skips all four,
  # and a push to main always runs them. Each shard caches its own build tree under its own key and
  # restores only the corpora its own targets seed from.
  fuzz-smoke-proto:
    name: fuzz-smoke-proto
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: changes
    if: needs.changes.outputs.fuzz == 'true'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772 # master # zizmor: ignore[ref-version-mismatch]
        with:
          # Pinned to the last good nightly. rustc 89c61a754 (2026-07-23) ICEs compiling tokio under
          # the fuzzer's ASAN/sancov flags (rustc_codegen_ssa operand.rs "not immediate"). The
          # `cargo +nightly-2026-07-23` steps below must use the same string. Restore floating
          # `nightly` (here and in those steps) once the upstream regression clears.
          toolchain: nightly-2026-07-23
          targets: x86_64-unknown-linux-gnu
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: fuzz
          key: proto
          save-if: ${{ github.ref == 'refs/heads/main' }}
      # Seed each 30 s run below with the corpus the nightly five-minute soaks have accumulated
      # (their cache keys, one per target), instead of starting libFuzzer from empty on every push:
      # fuzz/corpus/<target> is gitignored, so without these the smoke re-derives from scratch what
      # the nightlies already found. Restore-only, deliberately: growing the corpus lineage is the
      # nightly's job, and a pull request's 30 s of finds is not worth a cache write per push. A key
      # that has no cache yet restores nothing and the run proceeds cold, exactly as before.
      - uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: fuzz/corpus/patchlist
          key: fuzz-corpus-patchlist-
          restore-keys: fuzz-corpus-patchlist-
      - uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: fuzz/corpus/oauth_stored
          key: fuzz-corpus-oauth_stored-
          restore-keys: fuzz-corpus-oauth_stored-
      - uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: fuzz/corpus/oauth_launch_params
          key: fuzz-corpus-oauth_launch_params-
          restore-keys: fuzz-corpus-oauth_launch_params-
      - uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: fuzz/corpus/http_date
          key: fuzz-corpus-http_date-
          restore-keys: fuzz-corpus-http_date-
      - uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: fuzz/corpus/sqex_base64
          key: fuzz-corpus-sqex_base64-
          restore-keys: fuzz-corpus-sqex_base64-
      - uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: fuzz/corpus/steam_ticket
          key: fuzz-corpus-steam_ticket-
          restore-keys: fuzz-corpus-steam_ticket-
      - uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: fuzz/corpus/launch_args
          key: fuzz-corpus-launch_args-
          restore-keys: fuzz-corpus-launch_args-
      - uses: taiki-e/install-action@7f4eb899022d8fe70b20c4f3de697aa85c309026 # v2.85.11
        with:
          tool: cargo-fuzz
      # Build, then a short timed run: every parser fed hostile SE input must stay panic- and
      # allocation-safe on any input. Pin the gnu target: cargo-fuzz's default picks musl here, whose
      # static libc is incompatible with the address sanitizer.
      - run: cargo +nightly-2026-07-23 fuzz build patchlist --target x86_64-unknown-linux-gnu
      - run: cargo +nightly-2026-07-23 fuzz run patchlist --target x86_64-unknown-linux-gnu -- -max_total_time=30 -rss_limit_mb=2048
      - run: cargo +nightly-2026-07-23 fuzz build oauth_stored --target x86_64-unknown-linux-gnu
      - run: cargo +nightly-2026-07-23 fuzz run oauth_stored --target x86_64-unknown-linux-gnu -- -max_total_time=30 -rss_limit_mb=2048
      - run: cargo +nightly-2026-07-23 fuzz build oauth_launch_params --target x86_64-unknown-linux-gnu
      - run: cargo +nightly-2026-07-23 fuzz run oauth_launch_params --target x86_64-unknown-linux-gnu -- -max_total_time=30 -rss_limit_mb=2048
      - run: cargo +nightly-2026-07-23 fuzz build http_date --target x86_64-unknown-linux-gnu
      - run: cargo +nightly-2026-07-23 fuzz run http_date --target x86_64-unknown-linux-gnu -- -max_total_time=30 -rss_limit_mb=2048
      - run: cargo +nightly-2026-07-23 fuzz build sqex_base64 --target x86_64-unknown-linux-gnu
      - run: cargo +nightly-2026-07-23 fuzz run sqex_base64 --target x86_64-unknown-linux-gnu -- -max_total_time=30 -rss_limit_mb=2048
      - run: cargo +nightly-2026-07-23 fuzz build steam_ticket --target x86_64-unknown-linux-gnu
      # A malloc bound as well as an RSS one: the ticket buffer is sized from the input length, so an
      # over-large reservation is exactly the failure this target exists to catch, and the transform
      # never needs more than a few times its input.
      - run: cargo +nightly-2026-07-23 fuzz run steam_ticket --target x86_64-unknown-linux-gnu -- -max_total_time=30 -rss_limit_mb=2048 -malloc_limit_mb=64
      - run: cargo +nightly-2026-07-23 fuzz build launch_args --target x86_64-unknown-linux-gnu
      # No malloc bound here, unlike the listener targets on the stores shard: this target's
      # allocations are bounded by the input length rather than by a number read out of it, so a
      # limit could only fire on a bug the builder's own debug assertion catches first (which a fuzz
      # build has enabled).
      - run: cargo +nightly-2026-07-23 fuzz run launch_args --target x86_64-unknown-linux-gnu -- -max_total_time=30 -rss_limit_mb=2048

  fuzz-smoke-stores:
    name: fuzz-smoke-stores
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: changes
    if: needs.changes.outputs.fuzz == 'true'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772 # master # zizmor: ignore[ref-version-mismatch]
        with:
          # Pinned to the last good nightly. rustc 89c61a754 (2026-07-23) ICEs compiling tokio under
          # the fuzzer's ASAN/sancov flags (rustc_codegen_ssa operand.rs "not immediate"). The
          # `cargo +nightly-2026-07-23` steps below must use the same string. Restore floating
          # `nightly` (here and in those steps) once the upstream regression clears.
          toolchain: nightly-2026-07-23
          targets: x86_64-unknown-linux-gnu
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: fuzz
          key: stores
          save-if: ${{ github.ref == 'refs/heads/main' }}
      # Corpus seeds for this shard's targets, restore-only, for the reason given on
      # fuzz-smoke-proto's restores.
      - uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: fuzz/corpus/secrets_frame
          key: fuzz-corpus-secrets_frame-
          restore-keys: fuzz-corpus-secrets_frame-
      - uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: fuzz/corpus/secrets_records
          key: fuzz-corpus-secrets_records-
          restore-keys: fuzz-corpus-secrets_records-
      - uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: fuzz/corpus/otp_import
          key: fuzz-corpus-otp_import-
          restore-keys: fuzz-corpus-otp_import-
      - uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: fuzz/corpus/otp_listener_request
          key: fuzz-corpus-otp_listener_request-
          restore-keys: fuzz-corpus-otp_listener_request-
      - uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: fuzz/corpus/otp_listener_framing
          key: fuzz-corpus-otp_listener_framing-
          restore-keys: fuzz-corpus-otp_listener_framing-
      - uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: fuzz/corpus/runner_manifest
          key: fuzz-corpus-runner_manifest-
          restore-keys: fuzz-corpus-runner_manifest-
      - uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: fuzz/corpus/component_manifest
          key: fuzz-corpus-component_manifest-
          restore-keys: fuzz-corpus-component_manifest-
      - uses: taiki-e/install-action@7f4eb899022d8fe70b20c4f3de697aa85c309026 # v2.85.11
        with:
          tool: cargo-fuzz
      # Build, then a short timed run: every parser fed hostile SE input must stay panic- and
      # allocation-safe on any input. Pin the gnu target: cargo-fuzz's default picks musl here, whose
      # static libc is incompatible with the address sanitizer.
      - run: cargo +nightly-2026-07-23 fuzz build secrets_frame --target x86_64-unknown-linux-gnu
      # A malloc bound as well as an RSS one: the header names a work factor and the reader has to
      # refuse an impossible one on the comparison rather than by trying to allocate for it, which is
      # the failure this target exists to catch.
      - run: cargo +nightly-2026-07-23 fuzz run secrets_frame --target x86_64-unknown-linux-gnu -- -max_total_time=30 -rss_limit_mb=2048 -malloc_limit_mb=64
      - run: cargo +nightly-2026-07-23 fuzz build secrets_records --target x86_64-unknown-linux-gnu
      # Same bound, same reason: every record's length comes out of the buffer being decoded.
      - run: cargo +nightly-2026-07-23 fuzz run secrets_records --target x86_64-unknown-linux-gnu -- -max_total_time=30 -rss_limit_mb=2048 -malloc_limit_mb=64
      - run: cargo +nightly-2026-07-23 fuzz build otp_import --target x86_64-unknown-linux-gnu
      # A malloc bound too: the pasted text is capped and the key it decodes to is capped, both before
      # anything is allocated for them, and an over-large reservation is the failure that would mean
      # one of those caps stopped being checked first.
      - run: cargo +nightly-2026-07-23 fuzz run otp_import --target x86_64-unknown-linux-gnu -- -max_total_time=30 -rss_limit_mb=2048 -malloc_limit_mb=64
      - run: cargo +nightly-2026-07-23 fuzz build otp_listener_request --target x86_64-unknown-linux-gnu
      # The tightest malloc bound in the set. This parser reads bytes a stranger on the network chose
      # and is meant to allocate nothing at all beyond the one fixed buffer the reader owns, so a
      # megabyte is already far more than a clean run can touch.
      - run: cargo +nightly-2026-07-23 fuzz run otp_listener_request --target x86_64-unknown-linux-gnu -- -max_total_time=30 -rss_limit_mb=2048 -malloc_limit_mb=16
      - run: cargo +nightly-2026-07-23 fuzz build otp_listener_framing --target x86_64-unknown-linux-gnu
      # This one asserts an equality rather than an absence, so unlike every other target here it can
      # fail without crashing: a verdict that depends on how the input was split trips its own assert.
      - run: cargo +nightly-2026-07-23 fuzz run otp_listener_framing --target x86_64-unknown-linux-gnu -- -max_total_time=30 -rss_limit_mb=2048 -malloc_limit_mb=16
      - run: cargo +nightly-2026-07-23 fuzz build runner_manifest --target x86_64-unknown-linux-gnu
      - run: cargo +nightly-2026-07-23 fuzz run runner_manifest --target x86_64-unknown-linux-gnu -- -max_total_time=30 -rss_limit_mb=2048
      - run: cargo +nightly-2026-07-23 fuzz build component_manifest --target x86_64-unknown-linux-gnu
      - run: cargo +nightly-2026-07-23 fuzz run component_manifest --target x86_64-unknown-linux-gnu -- -max_total_time=30 -rss_limit_mb=2048

  fuzz-smoke-sqpack:
    name: fuzz-smoke-sqpack
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: changes
    if: needs.changes.outputs.fuzz == 'true'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772 # master # zizmor: ignore[ref-version-mismatch]
        with:
          # Pinned to the last good nightly. rustc 89c61a754 (2026-07-23) ICEs compiling tokio under
          # the fuzzer's ASAN/sancov flags (rustc_codegen_ssa operand.rs "not immediate"). The
          # `cargo +nightly-2026-07-23` steps below must use the same string. Restore floating
          # `nightly` (here and in those steps) once the upstream regression clears.
          toolchain: nightly-2026-07-23
          targets: x86_64-unknown-linux-gnu
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: fuzz
          key: sqpack
          save-if: ${{ github.ref == 'refs/heads/main' }}
      # Corpus seeds for this shard's targets, restore-only, for the reason given on
      # fuzz-smoke-proto's restores.
      - uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: fuzz/corpus/sqpack_codec
          key: fuzz-corpus-sqpack_codec-
          restore-keys: fuzz-corpus-sqpack_codec-
      - uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: fuzz/corpus/sqpack_index
          key: fuzz-corpus-sqpack_index-
          restore-keys: fuzz-corpus-sqpack_index-
      - uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: fuzz/corpus/sqpack_entry
          key: fuzz-corpus-sqpack_entry-
          restore-keys: fuzz-corpus-sqpack_entry-
      - uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: fuzz/corpus/sqpack_inspect
          key: fuzz-corpus-sqpack_inspect-
          restore-keys: fuzz-corpus-sqpack_inspect-
      - uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: fuzz/corpus/sqpack_mods
          key: fuzz-corpus-sqpack_mods-
          restore-keys: fuzz-corpus-sqpack_mods-
      - uses: taiki-e/install-action@7f4eb899022d8fe70b20c4f3de697aa85c309026 # v2.85.11
        with:
          tool: cargo-fuzz
      # Build, then a short timed run: every parser fed hostile SE input must stay panic- and
      # allocation-safe on any input. Pin the gnu target: cargo-fuzz's default picks musl here, whose
      # static libc is incompatible with the address sanitizer.
      - run: cargo +nightly-2026-07-23 fuzz build sqpack_codec --target x86_64-unknown-linux-gnu
      - run: cargo +nightly-2026-07-23 fuzz run sqpack_codec --target x86_64-unknown-linux-gnu -- -max_total_time=30 -rss_limit_mb=2048
      - run: cargo +nightly-2026-07-23 fuzz build sqpack_index --target x86_64-unknown-linux-gnu
      - run: cargo +nightly-2026-07-23 fuzz run sqpack_index --target x86_64-unknown-linux-gnu -- -max_total_time=30 -rss_limit_mb=2048
      - run: cargo +nightly-2026-07-23 fuzz build sqpack_entry --target x86_64-unknown-linux-gnu
      # A malloc bound as well as an RSS one: the readers reserve at most a megabyte at a time, and
      # `vec![0u8; n]` never touches its pages, so an RSS limit alone would not notice a reservation
      # made out of a declared size.
      - run: cargo +nightly-2026-07-23 fuzz run sqpack_entry --target x86_64-unknown-linux-gnu -- -max_total_time=30 -rss_limit_mb=2048 -malloc_limit_mb=64
      - run: cargo +nightly-2026-07-23 fuzz build sqpack_inspect --target x86_64-unknown-linux-gnu
      # The same malloc bound, for the same reason: the inspector reads a suspect container through
      # those same readers.
      - run: cargo +nightly-2026-07-23 fuzz run sqpack_inspect --target x86_64-unknown-linux-gnu -- -max_total_time=30 -rss_limit_mb=2048 -malloc_limit_mb=64
      - run: cargo +nightly-2026-07-23 fuzz build sqpack_mods --target x86_64-unknown-linux-gnu
      # Mod detection reads the same suspect containers, and its other input is a map a caller built,
      # so both are hostile here.
      - run: cargo +nightly-2026-07-23 fuzz run sqpack_mods --target x86_64-unknown-linux-gnu -- -max_total_time=30 -rss_limit_mb=2048 -malloc_limit_mb=64

  fuzz-smoke-patch:
    name: fuzz-smoke-patch
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: changes
    if: needs.changes.outputs.fuzz == 'true'
    steps:
