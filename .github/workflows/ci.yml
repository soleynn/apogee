name: CI

on:
  push:
    branches: [main]
  pull_request:

# Cancel superseded runs on the same ref instead of letting them pile up.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  CARGO_NET_RETRY: "10"
  RUSTUP_MAX_RETRIES: "10"

permissions:
  contents: read

jobs:
  # Which expensive jobs are worth running for this change. Computed with git rather than a third
  # party action so there is nothing extra to pin or audit.
  changes:
    name: changes
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      fuzz: ${{ steps.filter.outputs.fuzz }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - id: filter
        env:
          # Empty on a push to main, where everything runs.
          BASE_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || '' }}
        run: |
          if [ -z "$BASE_SHA" ]; then
            echo "fuzz=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          # The crates behind the fuzz targets, plus the fuzz workspace itself. Every name has to be a
          # real directory: `crates/sqex-cryptography` matched nothing, and a crate left off this list
          # means a change to it skips the target that covers it.
          if git diff --name-only "$BASE_SHA"...HEAD | grep -qE '^(fuzz/|crates/(sqex-proto|sqex-crypto|apogee-fetch|apogee-sqpack|apogee-zipatch|apogee-patcher|apogee-runtime|apogee-addons)/)'; then
            echo "fuzz=true" >> "$GITHUB_OUTPUT"
          else
            echo "fuzz=false" >> "$GITHUB_OUTPUT"
          fi

  fmt:
    name: fmt
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@2c7215f132e9ebf062739d9130488b56d53c060c # master # zizmor: ignore[ref-version-mismatch]
        with:
          toolchain: "1.97.0"
          components: rustfmt
      - run: cargo fmt --all --check
      # The dev tools are separate workspaces, so --all skips them; format-check them too.
      - run: cargo fmt --manifest-path tools/sqex-proto-probe/Cargo.toml --all --check
      - run: cargo fmt --manifest-path tools/boot-check/Cargo.toml --all --check
      - run: cargo fmt --manifest-path tools/catalog-sign/Cargo.toml --all --check

  clippy:
    name: clippy
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@2c7215f132e9ebf062739d9130488b56d53c060c # master # zizmor: ignore[ref-version-mismatch]
        with:
          toolchain: "1.97.0"
          components: clippy
      - uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4 # v2.9.1
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - run: cargo clippy --all-targets --all-features -- -D warnings
      # Lint the dev tools too (separate workspaces the run above misses), so the probe cannot rot on
      # a sqex-proto API change without CI noticing.
      - run: cargo clippy --manifest-path tools/sqex-proto-probe/Cargo.toml --all-targets -- -D warnings
      - run: cargo clippy --manifest-path tools/boot-check/Cargo.toml --all-targets -- -D warnings
      - run: cargo clippy --manifest-path tools/catalog-sign/Cargo.toml --all-targets -- -D warnings

  test-linux:
    name: test-linux
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@2c7215f132e9ebf062739d9130488b56d53c060c # master # zizmor: ignore[ref-version-mismatch]
        with:
          toolchain: "1.97.0"
      - uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4 # v2.9.1
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - uses: taiki-e/install-action@18b1216eba7f8039b0f8d131d5473787f0edce68 # v2.85.3
        with:
          tool: nextest
      - run: cargo nextest run --profile ci --workspace --no-tests=pass
      - run: cargo test --workspace --doc
      # The unverified-download-over-TLS test needs a client that trusts a loopback test certificate,
      # exposed only behind apogee-fetch's test-only `testing` feature, so it runs as its own step.
      - run: cargo test -p apogee-fetch --features testing --test none_over_tls
      # Same reason: the component-manifest fetch is checked over TLS against a loopback certificate. It
      # is what pins the property that a manifest edit reaches the client at all.
      - run: cargo test -p apogee-addons --features testing --test manifest_fetch
      # Dalamud's whole install pipeline against a distribution served entirely from loopback, for the
      # same reason. Its own step because a gated test that nothing runs still compiles under clippy and
      # so passes silently, which is the one failure mode a feature gate introduces.
      - run: cargo test -p apogee-addons --features testing --test dalamud_fetch
      # The runner catalog's equivalent. This one already rides along with the workspace run above,
      # because apogee-addons dev-depends on apogee-runtime with `testing` on and that resolves
      # workspace-wide. Named anyway so the coverage does not rest on another crate's dev-dependency.
      - run: cargo test -p apogee-runtime --features testing --test catalog_fetch
      # The corpus fetcher lives behind the `corpus` feature (off by default so it stays out of the
      # plain and cross builds); its self-test is hermetic (chaos-server-backed, no network).
      - run: cargo test -p apogee-test-support --features corpus corpus
      # The CLI patch e2e drives a real chaos-served patch download-and-apply through the built binary;
      # it needs the test-only `fixtures` feature (scripted transport), so it runs as its own step. No
      # wine (the patch command never launches), so it belongs in the hermetic job, not the wine one.
      - run: cargo test -p apogee-cli --features fixtures --test patch_e2e

  # Process supervision on stock wine: launches a stub PE and proves the /proc scanner resolves it,
  # kills it targeted, and that wineserver -k is the separate broad stop. A required gate: the
  # scanner logic is also covered hermetically in test-linux without wine, but only a real wine run
  # exercises the /proc resolution and the CLI leak detector end to end. Both steps run
  # single-threaded with WINEDEBUG=-all to keep headless wine deterministic; if real-wine startup
  # ever proves flaky, wrap the wine steps in a bounded retry rather than making the job advisory.
  test-linux-wine:
    name: test-linux-wine
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@2c7215f132e9ebf062739d9130488b56d53c060c # master # zizmor: ignore[ref-version-mismatch]
        with:
          toolchain: "1.97.0"
      - uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4 # v2.9.1
        with:
          key: wine
          save-if: ${{ github.ref == 'refs/heads/main' }}
      # Host wine runs the game; the MinGW cross-compiler builds the stub PE the test launches.
      - name: Install wine and the MinGW cross toolchain
        run: |
          sudo dpkg --add-architecture i386
          sudo apt-get update
          sudo apt-get install -y wine64 wine gcc-mingw-w64-x86-64
      - name: Supervision under stock wine
        env:
          WINEDEBUG: "-all"
        run: cargo test -p apogee-runtime --features wine-integration --test supervise_wine -- --test-threads=1
      # Prefix lifecycle on stock wine: wineboot -i is recorded, a broken prefix is targeted-fixed
      # without a delete, and in-process path translation round-trips against the winepath oracle.
      - name: Prefix lifecycle under stock wine
        env:
          WINEDEBUG: "-all"
        run: cargo test -p apogee-runtime --features wine-integration --test prefix_wine -- --test-threads=1
      # Running a setup program inside a prefix: `reg` resolves as a program there, a write is visible to
      # a later read, and repeating it succeeds rather than blocking on an overwrite prompt.
      - name: Prefix setup programs under stock wine
        env:
          WINEDEBUG: "-all"
        run: cargo test -p apogee-runtime --features wine-integration --test prefix_program_wine -- --test-threads=1
      # The shipped prefix verb applied to a real prefix three times: applied, a no-op, and applied again
      # over a value already set, which is the part the prefix's own record cannot stand in for.
      - name: Prefix verbs under stock wine
        env:
          WINEDEBUG: "-all"
        run: cargo test -p apogee-addons --features wine-integration --test verb_wine -- --test-threads=1
      # End-to-end: the CLI logs in against scripted fixtures and launches a stub game through system
      # wine, resolving the real process and killing it. This is the login → register → launch proof
      # and the output leak detector.
      - name: CLI login and launch under stock wine
        env:
          WINEDEBUG: "-all"
        run: cargo test -p apogee-cli --features wine-integration --test e2e -- --test-threads=1

  # A real credential store in headless CI. The three conditions the store has to tell apart (an
  # unlocked round trip, a locked collection, a bus with no provider on it) plus the proof of what
  # actually crosses the socket. The classification is unit-tested hermetically in test-linux, but
  # only a real provider produces the errors it classifies, and only a real socket shows whether the
  # secret crossed it in the clear.
  test-linux-secret-service:
    name: test-linux-secret-service
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@2c7215f132e9ebf062739d9130488b56d53c060c # master # zizmor: ignore[ref-version-mismatch]
        with:
          toolchain: "1.97.0"
      - uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4 # v2.9.1
        with:
          key: secret-service
          save-if: ${{ github.ref == 'refs/heads/main' }}
      # `dbus` carries dbus-run-session; socat is the relay the wire capture reads through. No
      # libsecret: the client speaks D-Bus directly and links nothing.
      - name: Install a session bus, a credential store, and the bus relay
        run: |
          sudo apt-get update
          sudo apt-get install -y dbus gnome-keyring socat
      # Build outside the bus session, so a compile error cannot look like a bus failure.
      - run: cargo test -p apogee-secrets --features testing --no-run
      # The unlock password has to be non-empty: an empty one leaves the daemon holding only its
      # in-memory collection, and every call then fails in a way that reads as a locked store.
      # XDG_DATA_HOME is a temp dir so running this same command locally cannot touch a real keyring.
      - name: Round trip against an unlocked store
        run: |
          export XDG_DATA_HOME="$(mktemp -d)"
          dbus-run-session -- bash -c '
            echo -n "apogee-ci" | gnome-keyring-daemon --unlock --components=secrets
            cargo test -p apogee-secrets --features testing --test secret_service -- --test-threads=1
          '
      # The import reads keys another launcher owns, so these cases seed the item onto the bus
      # directly instead of writing it through this crate. A test that wrote it with the same code
      # that reads it would pass whatever key strings it used, which is the one thing worth proving.
      - name: Import a password another launcher stored
        run: |
          export XDG_DATA_HOME="$(mktemp -d)"
          dbus-run-session -- bash -c '
            echo -n "apogee-ci" | gnome-keyring-daemon --unlock --components=secrets
            cargo test -p apogee-secrets --features testing --test foreign_import -- --test-threads=1
          '
      # Locking is one-way here: unlocking again needs a prompt a headless session cannot answer, so
      # this gets a keyring of its own and leaves it locked behind it. Only the probe is asserted;
      # a store operation against a locked collection blocks on that same prompt for an unpredictable
      # time, so those classifications are pinned by unit tests instead.
      - name: A locked store probes as locked
        run: |
          export XDG_DATA_HOME="$(mktemp -d)"
          # The opt-in the test refuses to run without. It is set here and nowhere else: the keyring
          # below is a throwaway on a private bus, and the same test against a desktop session would
          # lock the user's real login keyring with no way to unlock it again.
          export APOGEE_KEYRING_LOCK_OK=1
          dbus-run-session -- bash -c '
            echo -n "apogee-ci" | gnome-keyring-daemon --unlock --components=secrets
            cargo test -p apogee-secrets --features testing --test secret_service_locked -- --test-threads=1
          '
      # No unlock here, deliberately: the daemon then never creates a login keyring, so the default
      # collection does not resolve. That is what a passwordless or autologin session looks like, and
      # it is the shape that reads as healthy unless the probe resolves the same collection the store
      # writes to. The in-memory session collection is always present and always unlocked.
      - name: Probe a provider that has never been initialized
        run: |
          export XDG_DATA_HOME="$(mktemp -d)"
          dbus-run-session -- bash -c '
            gnome-keyring-daemon --components=secrets &
            sleep 2
            cargo test -p apogee-secrets --features testing --test probe_no_collection -- --test-threads=1
          '
      # This leg needs its own bus. With a keyring installed, D-Bus activates the credential store on
      # demand from its service file, so an empty service directory is the only way to get a session
      # that genuinely cannot produce one.
      - name: Probe a bus that cannot produce a credential store
        run: |
          conf="$(mktemp)"
          svc="$(mktemp -d)"
          cat > "$conf" <<EOF
          <!DOCTYPE busconfig PUBLIC "-//freedesktop//DTD D-BUS Bus Configuration 1.0//EN"
           "http://www.freedesktop.org/standards/dbus/1.0/busconfig.dtd">
          <busconfig>
            <type>session</type>
            <listen>unix:tmpdir=/tmp</listen>
            <servicedir>$svc</servicedir>
            <!-- receive_sender is not optional: without it the daemon drops every reply and any
                 client hangs waiting for one it will never get. -->
            <policy context="default">
              <allow send_destination="*"/>
              <allow receive_sender="*"/>
              <allow own="*"/>
            </policy>
          </busconfig>
          EOF
          dbus-run-session --config-file="$conf" -- \
            cargo test -p apogee-secrets --features testing --test probe_no_backend -- --test-threads=1
      # The client talks to a relay socket rather than the bus socket, so the raw stream is on disk
      # afterwards: the secret must not be in it and the encrypted transport must be named in it.
      - name: What crosses the session bus
        run: |
          export XDG_DATA_HOME="$(mktemp -d)"
          export APOGEE_BUS_CAPTURE="$(mktemp -d)"
          dbus-run-session -- bash -c '
            echo -n "apogee-ci" | gnome-keyring-daemon --unlock --components=secrets
            real="${DBUS_SESSION_BUS_ADDRESS#unix:path=}"; real="${real%%,*}"
            socat -r "$APOGEE_BUS_CAPTURE/c2s.bin" -R "$APOGEE_BUS_CAPTURE/s2c.bin" \
              UNIX-LISTEN:"$APOGEE_BUS_CAPTURE/bus.sock",fork UNIX-CONNECT:"$real" &
            relay=$!
            sleep 1
            DBUS_SESSION_BUS_ADDRESS="unix:path=$APOGEE_BUS_CAPTURE/bus.sock" \
              cargo test -p apogee-secrets --features testing --test bus_encrypted -- --test-threads=1
            status=$?
            kill "$relay" 2>/dev/null || true
            exit "$status"
          '

  build-windows-cross:
    name: build-windows-cross
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@2c7215f132e9ebf062739d9130488b56d53c060c # master # zizmor: ignore[ref-version-mismatch]
        with:
          toolchain: "1.97.0"
          targets: x86_64-pc-windows-gnu
      - uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4 # v2.9.1
        with:
          key: windows-cross
          save-if: ${{ github.ref == 'refs/heads/main' }}
      # The GNU/MinGW ABI cross-compiles from a plain apt package: no MSVC SDK download, no llvm-lib,
      # no EULA. The Windows components run under Wine, where GNU-ABI binaries are fine.
      - name: Install the MinGW-w64 cross toolchain
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends gcc-mingw-w64-x86-64 g++-mingw-w64-x86-64
      - run: cargo build --target x86_64-pc-windows-gnu --workspace

  # The one path no other job can reach. `build-windows-cross` runs `cargo build`, not
  # `--all-targets`, so a Windows test target is never even type-checked there, and the credential
  # store the import reads exists only here. Advisory: the branch ruleset's required contexts are
  # fixed, and adding one is a separate change.
  test-windows-credential-store:
    name: test-windows-credential-store
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@2c7215f132e9ebf062739d9130488b56d53c060c # master # zizmor: ignore[ref-version-mismatch]
        with:
          toolchain: "1.97.0"
      - uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4 # v2.9.1
        with:
          key: windows-credential-store
          save-if: ${{ github.ref == 'refs/heads/main' }}
      # Seeded with the platform's own tool rather than through this crate, for the same reason the
      # bus job seeds its item directly: a fixture written by the code under test proves only that it
      # agrees with itself, and the target string is the whole contract.
      #
      # `cmdkey` writes the blob as UTF-16, which is what the store this reads holds text in.
      - name: Seed a credential the way the other launcher would
        shell: cmd
        run: |
          cmdkey /generic:XIVLAUNCHER-ci-current /user:ci-current /pass:current-password
          cmdkey /generic:"FINAL FANTASY XIV-ci-legacy" /user:ci-legacy /pass:legacy-password
      # The lib's own tests run here too, and only here: the blob decode is Windows-gated, so
      # `--test windows_credentials` alone would build the lib as a plain dependency and never
      # compile it. Named separately because the other integration targets in this crate need a
      # session bus and do not build on this platform.
      - run: cargo test -p apogee-secrets --features mock --lib
      - run: cargo test -p apogee-secrets --features testing --test windows_credentials -- --test-threads=1

  deny:
    name: deny
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: EmbarkStudios/cargo-deny-action@3c6349835b2b7b196a839186cb8b78e02f7b5f25 # v2.1.1

  audit:
    name: audit
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@2c7215f132e9ebf062739d9130488b56d53c060c # master # zizmor: ignore[ref-version-mismatch]
        with:
          toolchain: "1.97.0"
      - run: bash scripts/audit.sh

  fuzz-smoke:
    name: fuzz-smoke
    runs-on: ubuntu-latest
    timeout-minutes: 25
    needs: changes
    # The longest job in the run, and only the parsers fed hostile input can regress it. A change
    # that touches none of their crates skips it; a push to main always runs it.
    if: needs.changes.outputs.fuzz == 'true'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@2c7215f132e9ebf062739d9130488b56d53c060c # master # zizmor: ignore[ref-version-mismatch]
        with:
          # Pinned to the last good nightly. rustc 89c61a754 (2026-07-23) ICEs compiling tokio under
          # the fuzzer's ASAN/sancov flags (rustc_codegen_ssa operand.rs "not immediate"). The
          # `cargo +nightly-2026-07-23` steps below must use the same string. Restore floating
          # `nightly` (here and in those steps) once the upstream regression clears.
          toolchain: nightly-2026-07-23
          targets: x86_64-unknown-linux-gnu
      - uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4 # v2.9.1
        with:
          workspaces: fuzz
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - uses: taiki-e/install-action@18b1216eba7f8039b0f8d131d5473787f0edce68 # v2.85.3
        with:
          tool: cargo-fuzz
      # Build, then a short timed run: every parser fed hostile SE input must stay panic- and
      # allocation-safe on any input. Pin the gnu target: cargo-fuzz's default picks musl here, whose
      # static libc is incompatible with the address sanitizer.
      - run: cargo +nightly-2026-07-23 fuzz build patchlist --target x86_64-unknown-linux-gnu
      - run: cargo +nightly-2026-07-23 fuzz run patchlist --target x86_64-unknown-linux-gnu -- -max_total_time=30 -rss_limit_mb=2048
      - run: cargo +nightly-2026-07-23 fuzz build oauth_stored --target x86_64-unknown-linux-gnu
      - run: cargo +nightly-2026-07-23 fuzz run oauth_stored --target x86_64-unknown-linux-gnu -- -max_total_time=30 -rss_limit_mb=2048
      - run: cargo +nightly-2026-07-23 fuzz build oauth_launch_params --target x86_64-unknown-linux-gnu
      - run: cargo +nightly-2026-07-23 fuzz run oauth_launch_params --target x86_64-unknown-linux-gnu -- -max_total_time=30 -rss_limit_mb=2048
      - run: cargo +nightly-2026-07-23 fuzz build sqex_base64 --target x86_64-unknown-linux-gnu
      - run: cargo +nightly-2026-07-23 fuzz run sqex_base64 --target x86_64-unknown-linux-gnu -- -max_total_time=30 -rss_limit_mb=2048
      - run: cargo +nightly-2026-07-23 fuzz build steam_ticket --target x86_64-unknown-linux-gnu
      # A malloc bound as well as an RSS one: the ticket buffer is sized from the input length, so an
      # over-large reservation is exactly the failure this target exists to catch, and the transform
      # never needs more than a few times its input.
      - run: cargo +nightly-2026-07-23 fuzz run steam_ticket --target x86_64-unknown-linux-gnu -- -max_total_time=30 -rss_limit_mb=2048 -malloc_limit_mb=64
      - run: cargo +nightly-2026-07-23 fuzz build launch_args --target x86_64-unknown-linux-gnu
      # No malloc bound here, unlike the two above: this target's allocations are bounded by the input
      # length rather than by a number read out of it, so a limit could only fire on a bug the builder's
      # own debug assertion catches first (which a fuzz build has enabled).
      - run: cargo +nightly-2026-07-23 fuzz run launch_args --target x86_64-unknown-linux-gnu -- -max_total_time=30 -rss_limit_mb=2048
      - run: cargo +nightly-2026-07-23 fuzz build runner_manifest --target x86_64-unknown-linux-gnu
      - run: cargo +nightly-2026-07-23 fuzz run runner_manifest --target x86_64-unknown-linux-gnu -- -max_total_time=30 -rss_limit_mb=2048
      - run: cargo +nightly-2026-07-23 fuzz build sqpack_codec --target x86_64-unknown-linux-gnu
      - run: cargo +nightly-2026-07-23 fuzz run sqpack_codec --target x86_64-unknown-linux-gnu -- -max_total_time=30 -rss_limit_mb=2048
      - run: cargo +nightly-2026-07-23 fuzz build sqpack_index --target x86_64-unknown-linux-gnu
      - run: cargo +nightly-2026-07-23 fuzz run sqpack_index --target x86_64-unknown-linux-gnu -- -max_total_time=30 -rss_limit_mb=2048
      - run: cargo +nightly-2026-07-23 fuzz build sqpack_entry --target x86_64-unknown-linux-gnu
      # A malloc bound as well as an RSS one: the readers reserve at most a megabyte at a time, and
      # `vec![0u8; n]` never touches its pages, so an RSS limit alone would not notice a reservation
      # made out of a declared size.
      - run: cargo +nightly-2026-07-23 fuzz run sqpack_entry --target x86_64-unknown-linux-gnu -- -max_total_time=30 -rss_limit_mb=2048 -malloc_limit_mb=64
      - run: cargo +nightly-2026-07-23 fuzz build sqpack_inspect --target x86_64-unknown-linux-gnu
      # The same malloc bound, for the same reason: the inspector reads a suspect container through
      # those same readers.
      - run: cargo +nightly-2026-07-23 fuzz run sqpack_inspect --target x86_64-unknown-linux-gnu -- -max_total_time=30 -rss_limit_mb=2048 -malloc_limit_mb=64
      - run: cargo +nightly-2026-07-23 fuzz build sqpack_mods --target x86_64-unknown-linux-gnu
      # Mod detection reads the same suspect containers, and its other input is a map a caller built,
      # so both are hostile here.
      - run: cargo +nightly-2026-07-23 fuzz run sqpack_mods --target x86_64-unknown-linux-gnu -- -max_total_time=30 -rss_limit_mb=2048 -malloc_limit_mb=64
      - run: cargo +nightly-2026-07-23 fuzz build zipatch_chunk --target x86_64-unknown-linux-gnu
      - run: cargo +nightly-2026-07-23 fuzz run zipatch_chunk --target x86_64-unknown-linux-gnu -- -max_total_time=30 -rss_limit_mb=2048
      - run: cargo +nightly-2026-07-23 fuzz build zipatch_sqpk --target x86_64-unknown-linux-gnu
      - run: cargo +nightly-2026-07-23 fuzz run zipatch_sqpk --target x86_64-unknown-linux-gnu -- -max_total_time=30 -rss_limit_mb=2048
      - run: cargo +nightly-2026-07-23 fuzz build zipatch_apply --target x86_64-unknown-linux-gnu
      - run: cargo +nightly-2026-07-23 fuzz run zipatch_apply --target x86_64-unknown-linux-gnu -- -max_total_time=30 -rss_limit_mb=2048
      - run: cargo +nightly-2026-07-23 fuzz build apzi_index --target x86_64-unknown-linux-gnu
      - run: cargo +nightly-2026-07-23 fuzz run apzi_index --target x86_64-unknown-linux-gnu -- -max_total_time=30 -rss_limit_mb=2048
      - run: cargo +nightly-2026-07-23 fuzz build fetch_multipart --target x86_64-unknown-linux-gnu
      - run: cargo +nightly-2026-07-23 fuzz run fetch_multipart --target x86_64-unknown-linux-gnu -- -max_total_time=30 -rss_limit_mb=2048
      - run: cargo +nightly-2026-07-23 fuzz build fetch_journal --target x86_64-unknown-linux-gnu
      - run: cargo +nightly-2026-07-23 fuzz run fetch_journal --target x86_64-unknown-linux-gnu -- -max_total_time=30 -rss_limit_mb=2048
      - run: cargo +nightly-2026-07-23 fuzz build index_manifest --target x86_64-unknown-linux-gnu
      - run: cargo +nightly-2026-07-23 fuzz run index_manifest --target x86_64-unknown-linux-gnu -- -max_total_time=30 -rss_limit_mb=2048
      - run: cargo +nightly-2026-07-23 fuzz build component_manifest --target x86_64-unknown-linux-gnu
      - run: cargo +nightly-2026-07-23 fuzz run component_manifest --target x86_64-unknown-linux-gnu -- -max_total_time=30 -rss_limit_mb=2048

  # The one live call: two unauthenticated GETs to SE's boot endpoint, covering both dispositions it
  # has. One sends the base sentinel and parses the boot patch chain it answers with; the other
  # re-sends the last version that chain offers, which must then read as current. It needs no account
  # and no secrets, so it runs on pull requests as well as on main, and it is not amber as a whole: a
  # misread is exactly the class of bug that otherwise surfaces only in a live patch run. Only an
  # unreachable service is tolerated, and the tool's exit code is what tells the two apart.
  boot-check-live:
    name: boot-check-live
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@2c7215f132e9ebf062739d9130488b56d53c060c # master # zizmor: ignore[ref-version-mismatch]
        with:
          toolchain: "1.97.0"
      - uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4 # v2.9.1
        with:
          workspaces: tools/boot-check
          save-if: ${{ github.ref == 'refs/heads/main' }}
      # Exit 2 is an unreachable service: retried once, then downgraded to an annotation, because an SE
      # CDN hiccup is not a fault in this repo. Every other non-zero exit is SE answering and the
      # answer being read wrongly, which is red. The parser is also covered hermetically by fixtures.
      - name: Live boot-version check (unreachable retried once)
        run: |
          probe() { cargo run --manifest-path tools/boot-check/Cargo.toml; }
          for attempt in 1 2; do
            # Assigned in the `||` branch, not from a `$?` after an `if`: a false `if` condition
            # completes successfully, so that would read 0 and swallow every failure.
            code=0
            probe || code=$?
            if [ "$code" -eq 0 ]; then
              exit 0
            fi
            if [ "$code" -ne 2 ]; then
              exit "$code"
            fi
            if [ "$attempt" = 1 ]; then
              sleep 5
            fi
          done
          echo "::warning title=boot-check-live::SE's boot endpoint was unreachable, so the live check did not run"
