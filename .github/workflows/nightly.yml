name: Nightly

# The soak tier: work too slow for every push. A longer fuzz run across every target on hostile input,
# the full-corpus differential apply against the recorded oracle tree (which the every-push run skips
# for lack of a primed corpus), and an informational coverage summary. Runs daily and on demand.
on:
  schedule:
    - cron: "0 5 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  fuzz-soak:
    name: fuzz-soak (${{ matrix.target }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        target:
          - patchlist
          - oauth_stored
          - oauth_launch_params
          - http_date
          - sqex_base64
          - steam_ticket
          - launch_args
          - runner_manifest
          - sqpack_codec
          - sqpack_index
          - sqpack_entry
          - sqpack_inspect
          - sqpack_mods
          - zipatch_chunk
          - zipatch_sqpk
          - zipatch_apply
          - apzi_index
          - fetch_multipart
          - fetch_journal
          - index_manifest
          - component_manifest
          - secrets_frame
          - secrets_records
          - foreign_secrets_file
          - otp_import
          - otp_listener_request
          - otp_listener_framing
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772 # master # zizmor: ignore[ref-version-mismatch]
        with:
          # Pinned to the last good nightly. rustc 89c61a754 (2026-07-23) ICEs compiling tokio under
          # the fuzzer's ASAN/sancov flags (rustc_codegen_ssa operand.rs "not immediate"). The
          # `cargo +nightly-2026-07-23` steps below must use the same string. Restore floating
          # `nightly` (here and in those steps) once the upstream regression clears.
          toolchain: nightly-2026-07-23
          targets: x86_64-unknown-linux-gnu
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: fuzz
          save-if: ${{ github.ref == 'refs/heads/main' }}
      # The corpus this target has accumulated across prior nightly runs, so each run seeds libFuzzer
      # with what earlier ones already found instead of starting from empty every time. Keyed on the
      # run id so every run saves a (grown) corpus under a new key; restore-keys falls back to the
      # most recent prior one by prefix match. fuzz/corpus/<target> is cargo-fuzz's own corpus
      # directory for this target and is gitignored, so this cache is its only persistence.
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: fuzz/corpus/${{ matrix.target }}
          key: fuzz-corpus-${{ matrix.target }}-${{ github.run_id }}
          restore-keys: |
            fuzz-corpus-${{ matrix.target }}-
      - uses: taiki-e/install-action@7f4eb899022d8fe70b20c4f3de697aa85c309026 # v2.85.11
        with:
          tool: cargo-fuzz
      # A five-minute soak per target (the every-push smoke is 30 s). The gnu target is pinned:
      # cargo-fuzz's default picks musl here, whose static libc is incompatible with the sanitizer.
      - run: cargo +nightly-2026-07-23 fuzz build ${{ matrix.target }} --target x86_64-unknown-linux-gnu
      - run: cargo +nightly-2026-07-23 fuzz run ${{ matrix.target }} --target x86_64-unknown-linux-gnu -- -max_total_time=300 -rss_limit_mb=2048

  differential-apply:
    name: differential-apply
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772 # master # zizmor: ignore[ref-version-mismatch]
        with:
          toolchain: "1.97.0"
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}
      # Fetch the committed boot corpus (URL + SHA256) into the cache; the pin covers the on-wire bytes.
      - run: cargo run -p apogee-test-support --features corpus --example prime_corpus
      # Apply the real boot chain, rebuild its index, and parse every fixture patch chunk by chunk.
      # The first two compare byte-for-byte against the recorded oracle tree. All three skip when the
      # corpus is unprimed (every-push), so they run here.
      #
      # The step above just primed it, so here "unprimed" cannot mean "no network" and a skip would be
      # this job reporting success for work it did not do. Declaring the corpus required turns that
      # skip back into a failure.
      - run: cargo test -p apogee-zipatch --test apply_boot --test index_corpus --test corpus_dump
        env:
          APOGEE_CORPUS_REQUIRED: "1"

  trust-anchors:
    name: trust-anchors
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772 # master # zizmor: ignore[ref-version-mismatch]
        with:
          toolchain: "1.97.0"
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}
      # The credential-carrying client accepts only the authorities Square Enix issues from, so a fifth
      # one refuses every login the day it starts being served. Nothing in the repository can see that
      # coming: it is a fact about certificates Square Enix rotates, so it is checked against the live
      # endpoints here rather than waited for. A failure means the shipped anchor set needs a root
      # adding before the next release, not that anything in this change broke.
      - run: "APOGEE_TLS_LIVE=1 cargo test -p apogee-core --lib trust:: -- --ignored --nocapture"

  coverage:
    name: coverage
    runs-on: ubuntu-latest
    # Informational only: a coverage regression is a signal, never a gate.
    continue-on-error: true
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772 # master # zizmor: ignore[ref-version-mismatch]
        with:
          toolchain: "1.97.0"
          components: llvm-tools-preview
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - uses: taiki-e/install-action@7f4eb899022d8fe70b20c4f3de697aa85c309026 # v2.85.11
        with:
          tool: cargo-llvm-cov
      - run: cargo llvm-cov --workspace --no-fail-fast --summary-only
